      <tr><td>Chargebacks</td><td>Open disputes and unauthorized-payment reports</td><td>Approved intake reference, channel and accurate account of what was reported.</td></tr>
      </tbody></table></div><p style="margin-top:1rem">Use the approval owner shown in the active workflow. Add the outcome and supporting record before closing the case.</p>`,
    writing: `<h2>Say it clearly</h2>
      <ul><li><strong>Open with AP.</strong> “Hi, this is [name] with Benzeen Auto Parts. Could you connect me with the person who handles vendor invoices for this location?”</li>
      <li><strong>Resolve a dispute.</strong> “Could you tell me which line is under review? I’ll verify it and follow up with the confirmed balance.”</li>
      <li><strong>Request a date.</strong> “Which invoices can AP include in the next run, and what date should I note for the payment?”</li>
      <li><strong>Use a secure channel.</strong> “I can send the approved payment option to your verified contact.” Keep card details out of email, chat, and call notes.</li>
      <li><strong>Close the call.</strong> “I’ll send the invoice today and check back Thursday at 10 a.m. Pacific. Does that work for your team?”</li></ul>
      <div class="grid cards"><div class="callout"><h3>Remittance email</h3><p><strong>Subject</strong> · Remittance request for your recent payment</p><p>Hi AP team, thank you for the payment. Could you send the invoice numbers, location and amount applied to each invoice for [approved payment reference]? We’ll use the breakdown to verify the posting. Thank you, [name].</p></div>
      <div class="callout"><h3>Internal handoff note</h3><p>[Verified contact and role] reported [issue] on [reference and line]. I checked [evidence]. [Verified amount or status]. Please [specific decision/action]. [Owner] to follow up [date, time and time zone].</p></div></div>`,
    terms: `<h2>Collections glossary</h2><div class="table-scroll"><table><thead><tr><th scope="col">Term</th><th scope="col">How agents use it</th></tr></thead><tbody>
      <tr><td>COD / will call</td><td>Collection on delivery under the order terms / customer pickup at the designated yard.</td></tr>
      <tr><td>Remittance / ACH trace</td><td>Instructions for how to apply received funds / reference used to trace an electronic deposit.</td></tr>
      <tr><td>AR / AP</td><td>Accounts receivable is money due to Benzeen. Accounts payable is the payer’s bill-processing function or Benzeen’s vendor-payment function.</td></tr>
      <tr><td>WO / DT</td><td>Work order / delivery ticket. In these workflows, a DT can be used for a return. Link it to the original invoice, and verify what stage it has reached.</td></tr>
      <tr><td>POD / BOL</td><td>Proof of delivery / bill of lading. Verify item, destination and event, not just the presence of a document.</td></tr>
      <tr><td>Core</td><td>An old part exchanged under the order’s terms. Receipt, inspection and a posted credit are separate events.</td></tr>
      <tr><td>NSF</td><td>Non-sufficient funds. Accounting should verify the exact return reason and reversal before requesting a replacement payment.</td></tr>
      <tr><td>Promise to pay / unapplied</td><td>A dated payment commitment / a receipt or credit that has not yet been applied to the intended invoice.</td></tr>
      <tr><td>Promotion / Powerlink</td><td>Moving a work order or return ticket to the authorized invoiced stage / the order and invoice system used to look up the underlying records.</td></tr>
      <tr><td>Chargeback</td><td>A payment dispute routed through the payment provider and handled by the designated disputes team.</td></tr>
      </tbody></table></div>`
  };

  function guide(id) {
    const selected = Object.hasOwn(guideEntries,id) ? id : "call";
    return title("Field guide","Keep this open during training for talk tracks, reconciliation examples and escalation decisions.") +
      `<nav class="guide-nav" aria-label="Field guide topics">${guideSections.map(([key,label]) =>
        `<a class="btn" href="#guide/${key}"${selected === key ? ' aria-current="page"' : ""}>${esc(label)}</a>`).join("")}</nav>
      <section class="panel guide-body">${guideEntries[selected]}</section>`;
  }

  function provenance() {
    return title("Curriculum sources","The scenarios adapt observed Benzeen workflows and add adjacent practice cases. Customer details, transaction references and example amounts are fictionalized.") +
      `<div class="grid cards">${Object.values(sources).map(source => `<article class="card"><h3>${esc(source.title)}</h3><p><strong>Tabs reviewed.</strong> ${esc(source.tabs)}</p><p>${esc(source.description)}</p></article>`).join("")}</div>
      <section class="section panel"><h2>Reference material</h2><p>Use the approved internal procedures when working a live case. The references below provide context for covered-debt and secure payment practices.</p>
      <ul><li><a href="https://leginfo.legislature.ca.gov/faces/billNavClient.xhtml?bill_id=202320240SB1286">California Legislature · SB 1286</a></li>
      <li><a href="https://www.pcisecuritystandards.org/faqs/1319/">PCI Security Standards Council · Handling card verification codes</a></li></ul></section>`;
  }

  function render(focus = false) {
    const [page = "dashboard", id] = (location.hash.slice(1) || "dashboard").split("/");
    if (page === "main") return;
    const views = { dashboard, learn, lesson, practice, case:caseView, exams:tests, test, review, guide, sources:provenance };
    const active = ({ lesson:"learn", case:"practice", test:"exams", review:"exams", sources:"guide" })[page] || page;
    document.getElementById("nav").innerHTML = navItems.map(([key,label,icon]) =>
      `<a class="nav-link ${active === key ? 'active' : ''}" href="#${key}"${active === key ? ' aria-current="page"' : ''}><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</a>`).join("");
    document.getElementById("crumb").textContent = navItems.find(([key]) => key === active)?.[1] || "Collections Academy";
    main.innerHTML = Object.hasOwn(views,page) ? views[page](id) : missing();
    if (page === "practice") results();
    setMenu(false);
    if (focus) {
      main.focus({ preventScroll:true });
      window.scrollTo(0,0);
    }
  }

  function updateFilters(event) {
    const field = ({search:"term","module-filter":"module","status-filter":"status"})[event.target.id];
    if (!field) return;
    filters = { ...filters, [field]:event.target.value, page:1 };
    if (field === "module" && location.hash.startsWith("#practice/")) {
      history.replaceState(null,"","#practice");
    }
    results();
  }

  function saveExamAnswer(form) {
    const answer = form && new FormData(form).get("decision");
    if (answer && state.running) {
      state.running.questions[state.running.index].answer = answer;
      save();
    }
  }

  main.addEventListener("submit", event => {
    const form = event.target;
    event.preventDefault();
    const decision = new FormData(form).get("decision");
    if (form.id === "practice-form") {
      const s = scenarioById.get(form.dataset.id);
      const correct = decision === "correct";
      if (correct) {
        completed.add(s.id);
        document.getElementById("mastery").textContent = "Mastered";
        save();
      }
      document.getElementById("case-feedback").innerHTML = correct
        ? `<p class="feedback"><strong>Correct.</strong> ${esc(s.action)}</p>`
        : `<p class="feedback retry"><strong>Try again.</strong> Check what the team must verify, then review the model answer when ready.</p>`;
    }
    if (form.id === "exam-form" && state.running) {
      saveExamAnswer(form);
      const running = state.running;
      if (running.index < running.questions.length-1) {
        running.index++;
        save();
        render(true);
      } else {
        submitTest();
      }
    }
  });

  main.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) {
      if (event.target.closest('a[href="#exams"]')) saveExamAnswer(document.getElementById("exam-form"));
      return;
    }
    const { action, id } = button.dataset;
    if (action === "clear-filters") {
      filters = { term:"", module:"", status:"", page:1 };
      history.replaceState(null,"","#practice");
      render(true);
      document.getElementById("search").focus();
    }
    if (action === "previous" || action === "next") {
      filters.page += action === "next" ? 1 : -1;
      results();
      document.getElementById("result-count").focus();
    }
    if (action === "start-exam") startExam(id);
    if (action === "discard-exam" && window.confirm("Discard the current mock test and its saved answers?")) {
      state.running = null;
      save();
      render(true);
    }
    if (action === "exam-back" && state.running?.index > 0) {
      saveExamAnswer(document.getElementById("exam-form"));
      state.running.index--;
      save();
      render(true);
    }
  });

  main.addEventListener("input", event => {
    if (event.target.id === "search") updateFilters(event);
  });
  main.addEventListener("change", event => {
    if (event.target.tagName === "SELECT") updateFilters(event);
    if (event.target.name === "decision" && event.target.form?.id === "exam-form") saveExamAnswer(event.target.form);
  });
  menu.addEventListener("click", () => setMenu(!sidebar.classList.contains("open")));
  document.addEventListener("keydown", event => {
    if (event.key === "Escape" && sidebar.classList.contains("open")) {
      setMenu(false);
      menu.focus();
    }
  });
  document.querySelector(".skip").addEventListener("click",event => {
    event.preventDefault();
    main.focus();
  });
  window.addEventListener("hashchange", () => render(true));
  if (!durable) document.querySelector(".side-foot").textContent = "Progress retained for this session";
  render();
})();
</script>
</body>
</html>
