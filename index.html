<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Benzeen Auto Parts Collections Academy. Train on 200 realistic customer calls, reconcile evidence, and practice payment follow-up and escalation.">
<title>Collections Academy | Benzeen Auto Parts</title>
<style>:root {
  color-scheme: light;
  --background: #f3f5fa; --paper: #fff; --nav: #121c34; --ink: #14213b;
  --muted: #50617b; --line: #dce3ef; --blue: #254bd8; --blue-dark: #1735a6;
  --mint: #67e2c0; --green: #126452; --radius: 18px;
  font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--ink); font-size: 16px; line-height: 1.55; }
a { color: var(--blue-dark); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; }
button, select { cursor: pointer; }
button:disabled { cursor: default; opacity: .56; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid #bf4f00; outline-offset: 3px; }
h1, h2, h3, p { margin-top: 0; }
h1, h2, h3 { line-height: 1.18; }
h1 { font-size: clamp(2.1rem, 5vw, 3.25rem); letter-spacing: -.05em; margin-bottom: .7rem; }
h2 { font-size: clamp(1.45rem, 3vw, 1.8rem); letter-spacing: -.028em; margin-bottom: .8rem; }
h3 { font-size: 1.1rem; margin-bottom: .48rem; }
p { margin-bottom: .8rem; }
ul, ol { padding-inline-start: 1.35rem; }
li + li { margin-top: .35rem; }
.skip { position: fixed; left: 12px; top: -200px; z-index: 9; padding: 10px; background: var(--paper); }
.skip:focus { top: 12px; }
.shell { min-height: 100vh; display: grid; grid-template-columns: 252px minmax(0,1fr); }
.sidebar { position: sticky; align-self: start; top: 0; height: 100dvh; padding: 30px 20px 20px; display: flex; flex-direction: column; background: var(--nav); color: #f3f6ff; z-index: 4; }
.brand { display: flex; width: fit-content; margin: 0 0 30px 7px; color: #fff; text-decoration: none; align-items: center; gap: 11px; font-weight: 800; letter-spacing: .09em; line-height: 1.1; }
.brandmark { display: grid; place-items: center; width: 39px; height: 39px; border-radius: 11px; color: #14284f; background: #8eead7; font-size: 1.43rem; font-weight: 900; letter-spacing: -.1em; padding-right: .12em; }
.brand-sub, .academy > span { display: block; font-size: .77rem; font-weight: 650; margin-top: 4px; color: #b8c9e9; letter-spacing: .10em; }
.academy { margin: 0 6px 20px; border-block: 1px solid #32415e; padding: 15px 0; }
.academy > span { letter-spacing: 0; margin: 0 0 3px; font-weight: 500; font-size: .88rem; }
.academy strong { font-size: 1.02rem; }
.nav-link { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; border: 1px solid transparent; border-radius: 10px; padding: 10px 12px; text-decoration: none; color: #c7d4ea; font-size: .96rem; font-weight: 600; }
.nav-link:hover { background: #223251; color: #fff; }
.nav-link.active { background: #26365a; border-color: #435782; color: #fff; }
.nav-icon { display: inline-grid; place-items: center; min-width: 18px; color: #a4bcf7; font-weight: 750; }
.nav-link.active .nav-icon { color: var(--mint); }
.side-foot { margin: auto 4px 0; padding-top: 20px; font-size: .82rem; color: #bac9e0; }
.side-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); margin-right: 6px; }
.workspace { min-width: 0; }
.topbar { height: 65px; display: flex; align-items: center; border-bottom: 1px solid var(--line); background: #fbfcff; padding: 0 max(24px, 3vw); color: #4b5f81; font-weight: 650; gap: 14px; }
.top-link { color: var(--ink); font-size: .91rem; margin-left: auto; text-decoration: none; }
.top-link:hover { text-decoration: underline; }
#menu { display: none; }
main { width: min(1350px, 100%); min-height: calc(100vh - 135px); margin-inline: auto; padding: 32px max(24px, 3vw) 22px; }
main:focus { outline: none; }
.footer { display: flex; gap: 14px; justify-content: space-between; padding: 16px max(24px, 3vw) 26px; max-width: 1350px; margin: auto; color: var(--muted); font-size: .87rem; }
.eyebrow { color: #38507c; font-size: .84rem; font-weight: 760; letter-spacing: .055em; text-transform: uppercase; margin-bottom: .55rem; }
.sub { color: var(--muted); max-width: 72ch; }
.hero { border-radius: 22px; background: radial-gradient(ellipse at 87% 28%, #3058b9 0, transparent 51%), linear-gradient(120deg,#142653,#1d3776); color: #fff; padding: clamp(25px, 3.5vw, 48px); display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 24px; align-items: center; overflow: hidden; }
.hero .eyebrow { color: #9debd9; }
.hero h1 { max-width: 17ch; }
.hero .sub { color: #d9e5ff; max-width: 54ch; }
.hero-stat { display: grid; gap: 12px; padding: 18px; border: 1px solid #7795d2; border-radius: 15px; background: #162b60bf; }
.hero-stat > div { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.hero-stat > div + div { padding-top: 11px; border-top: 1px solid #5974ae; }
.hero-stat strong { color: #a5f1df; font-size: 1.35rem; min-width: 3ch; line-height: 1.2; }
.hero-stat span { font-size: .90rem; color: #eef3ff; }
.actions, .meta, .section-head, .pagers { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.actions { margin-top: 16px; }
.btn, .icon-button { display: inline-flex; justify-content: center; align-items: center; gap: .38rem; color: var(--ink); background: #fff; border: 1px solid #c6d1e3; border-radius: 10px; padding: .62rem .9rem; text-decoration: none; font-weight: 720; font-size: .95rem; line-height: 1.25; min-height: 43px; }
.btn:hover, .icon-button:hover { border-color: #5471ab; background: #eff4ff; }
.btn.primary { color: white; background: var(--blue); border-color: var(--blue); }
.btn.primary:hover { background: var(--blue-dark); }
.hero .btn.primary { color: #112653; background: #9eead8; border-color: #9eead8; }
.hero .btn.primary:hover { background: #c4f4e9; }
.hero .btn.secondary { color: #fff; background: #294379; border-color: #8ba5da; }
.hero .btn.secondary:hover { background: #385893; }
.grid { display: grid; gap: 16px; }
.kpis { grid-template-columns: repeat(3,minmax(0,1fr)); margin-block: 20px 27px; }
.split { grid-template-columns: minmax(0,1.12fr) minmax(0,.88fr); align-items: start; }
.cards { grid-template-columns: repeat(2,minmax(0,1fr)); }
.exam-cards, .three { grid-template-columns: repeat(3,minmax(0,1fr)); }
.panel, .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(16px, 2.1vw, 23px); min-width: 0; }
.card { display: flex; flex-direction: column; align-items: flex-start; }
.card .actions { margin-top: auto; padding-top: 12px; }
.card p { color: var(--muted); }
.kpi strong { display: block; font-size: clamp(1.35rem,4vw,2.15rem); line-height: 1.14; letter-spacing: -.03em; margin: 4px 0; }
.kpi span, .small { font-size: .89rem; color: var(--muted); }
.section-head { justify-content: space-between; margin-bottom: 8px; }
.section-head h2, .section-head p { margin: 0; }
.section { margin-block: 24px; }
.module-symbol { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: #eef1fb; color: var(--accent, var(--blue)); font-size: 1.22rem; font-weight: 850; margin-bottom: 12px; }
.tag { display: inline-block; background: #e9effb; border-radius: 999px; color: #29447f; padding: .22rem .58rem; font-weight: 660; font-size: .80rem; }
.tag.good { background: #dff5ed; color: #145b47; }
.tag.critical { background: #fff0d9; color: #8b4510; }
.chart { display: grid; gap: 11px; margin-top: 12px; }
.chart-row { display: grid; grid-template-columns: minmax(125px, .95fr) minmax(40px,1fr) 3.2rem; gap: 8px; align-items: center; }
.chart-label { font-size: .9rem; font-weight: 640; text-decoration: none; color: var(--ink); }
.chart-label:hover { text-decoration: underline; }
.track { height: 9px; background: #e5ebf7; border-radius: 9px; overflow: hidden; }
.track > span { display: block; height: 100%; width: var(--fill); background: var(--accent,var(--blue)); border-radius: inherit; }
.chart-val { text-align: right; font-size: .88rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.row-list { list-style: none; margin: 0; padding: 0; }
.row-list > li { margin: 0; padding: .72rem 0; border-bottom: 1px solid var(--line); }
.row-list > li:last-child { border: 0; }
.row-list a { font-weight: 680; }
.section-title { margin-bottom: 16px; }
.section-title .sub { margin-bottom: 0; }
.filterbar { display: grid; grid-template-columns: 1.45fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.filterbar label, .field { display: grid; gap: 4px; font-size: .91rem; font-weight: 690; }
input[type=search], select, textarea { min-width: 0; width: 100%; border: 1px solid #b9c7dc; border-radius: 9px; padding: .56rem .7rem; background: #fff; color: var(--ink); }
select { appearance: none; padding-right: 2rem; background: linear-gradient(45deg,transparent 50%,#344d83 51%) calc(100% - 15px) 50%/6px 6px no-repeat, linear-gradient(135deg,#344d83 50%,transparent 51%) calc(100% - 9px) 50%/6px 6px no-repeat,#fff; }
textarea { min-height: 90px; resize: vertical; }
.results-summary { margin: 12px 1px; color: var(--muted); }
.pagers { justify-content: center; margin-top: 18px; }
.case-card h3 { margin-top: 10px; }
.case-card p { flex: 1; }
.case-card a { text-decoration-thickness: 1px; }
.case-quote { margin: 0 0 16px; background: #eef2ff; border-left: 4px solid var(--blue); border-radius: 0 12px 12px 0; padding: 15px 17px; font-size: clamp(1.03rem,2vw,1.24rem); color: #1e366f; font-weight: 630; }
.case-layout { display: grid; grid-template-columns: minmax(0,1.45fr) minmax(0,1fr); gap: 16px; align-items: start; }
.question { border: 0; padding: 0; margin: 0; min-width: 0; }
.question legend { font-size: 1.1rem; font-weight: 740; margin: 0 0 10px; padding: 0; }
.choice { display: flex; align-items: baseline; gap: 9px; padding: .7rem .72rem; border: 1px solid var(--line); border-radius: 10px; margin-bottom: .55rem; cursor: pointer; line-height: 1.4; }
.choice:hover, .choice:has(:checked) { border-color: #91a5ed; background: #f4f6ff; }
.choice input { accent-color: var(--blue); flex: none; }
.feedback { background: #e8f5ee; border: 1px solid #b8e0cf; color: #114d3d; padding: 12px; margin-top: 12px; border-radius: 10px; }
.feedback.retry { background: #fff4e3; border-color: #eed3a7; color: #71400d; }
details { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
details summary { cursor: pointer; font-weight: 730; }
details p { margin: 9px 0; }
.callout { background: #edf2fd; border: 1px solid #cedcf6; padding: 13px 15px; border-radius: 12px; margin-top: 12px; }
.callout > :last-child { margin-bottom: 0; }
.table-scroll { overflow: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: .95rem; }
th, td { padding: .73rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: #3c5078; background: #f1f4fb; }
.guide-nav { display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 16px; }
.guide-nav a[aria-current=page] { background: #e7edff; color: var(--blue-dark); border-color: #a8baf2; }
.guide-body { min-height: 310px; }
.guide-body p { max-width: 76ch; }
.status { color: var(--muted); font-size: .88rem; }
.print-only { display: none; }
@media (max-width:1040px) {
  .shell { grid-template-columns: 212px minmax(0,1fr); }
  .sidebar { padding-inline: 15px; }
  .exam-cards, .three { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .hero { grid-template-columns: minmax(0,1fr) 195px; }
}
@media (max-width:850px) {
  .shell { display: block; }
  .topbar { height: 54px; }
  #menu { display: inline-flex; min-height: 34px; padding: .3rem .6rem; }
  .sidebar { display: none; position: absolute; top: 54px; left: 0; height: auto; width: min(92vw, 295px); border-radius: 0 0 15px; box-shadow: 0 12px 25px #14264855; }
  .sidebar.open { display: flex; }
  .brand { margin-bottom: 16px; }
}
@media (max-width:620px) {
  main { padding: 19px 14px; }
  .topbar, .footer { padding-inline: 14px; }
  .hero, .split, .case-layout, .exam-cards, .three, .cards, .filterbar { grid-template-columns: minmax(0,1fr); }
  .hero-stat { display: none; }
  .hero { gap: 12px; }
  .kpis { gap: 6px; }
  .kpi { padding: 10px 7px; overflow-wrap: anywhere; }
  .kpi .small { font-size: .78rem; }
  .meta { gap: 5px; }
  .footer { flex-direction: column; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
@media print {
  .sidebar, .topbar, .footer, .actions, .guide-nav { display: none !important; }
  .shell { display: block; }
  .print-only { display: block; }
  main { padding: 0; }
}
</style>

<script>const ACADEMY = {"modules":[{"id":"cod","title":"COD & will call","stage":"Transaction basics","icon":"$","color":"#3c63ed","sources":["calling","fulfillment"],"summary":"Trace a missed or short collection from the delivery or pickup event to the posted payment.","concept":"Delivery, collection and posting are three separate events. Start with the release method and the exact tender. When you verify the short amount, document the difference and offer the approved payment path.","checks":["Confirm delivery or yard release and the terms in effect.","Separate a quoted amount, authorized card amount and captured amount.","Record the remainder and update the callback when payment posts."]},{"id":"remittance","title":"Remittance & partial payments","stage":"Transaction basics","icon":"≋","color":"#7459db","sources":["calling","collections"],"summary":"Match a check or ACH to the invoices, locations and approved deductions it actually covers.","concept":"Remittance is the payer's allocation instruction. The bank receipt shows funds moved. The ledger shows where funds were applied. Reconcile all three before clearing an invoice or requesting a short pay.","checks":["Identify payer, payment reference, amount and date.","Request the invoice and location breakdown for missing allocations.","Compare the allowed credit and its previous uses before requesting a correction."]},{"id":"credits","title":"Credits, deductions & cores","stage":"Transaction basics","icon":"±","color":"#0b897a","sources":["sales","calling","fulfillment"],"summary":"Distinguish a credit memo's original amount, posted applications and the usable balance today.","concept":"A promised adjustment, a core returned, an issued credit and a credit applied are separate milestones. Tie the exact invoice or return to the approved evidence and Accounting's posting.","checks":["Pull the credit history and eligible invoice or account.","Confirm core receipt or written approval with the right owner.","Explain the net amount only after verifying the intended application."]},{"id":"refunds","title":"Refunds & disbursements","stage":"Exceptions","icon":"↺","color":"#b96928","sources":["calling","sales"],"summary":"Verify the payer, credit and refund channel. Trace what was issued, delivered or cleared.","concept":"Refund requests with a changed payee, address or destination require independent verification and an authorized decision. A refund request, an approved credit and a completed disbursement are different stages.","checks":["Verify through a registered contact and pull the original tender.","Distinguish approved, issued, received and cleared statuses.","Escalate payee mismatches, duplicates and active chargebacks."]},{"id":"calls","title":"Customer calls & follow-ups","stage":"Foundations","icon":"◌","color":"#3c63ed","sources":["collections","calling"],"summary":"Find the authorized contact, use neutral language and secure a useful next step on each call.","concept":"Start with who you are and a brief invoice-related purpose. Confirm the recipient's role before sharing detail. When payment or a resolution needs review, book a dated check-in and leave one clear record for the next agent.","checks":["Verify the AP contact before sharing documents or balances.","Ask one clear question and use a verified communication channel.","Record outcome, exact next action, owner, date and time zone."]},{"id":"corporate","title":"Corporate & multi-shop AP","stage":"Account ownership","icon":"▤","color":"#7459db","sources":["collections","calling"],"summary":"Identify who pays for each branch and adapt follow-up to the payer's calendar and channel.","concept":"A trade name can span corporate locations, franchisees and independent entities. Find the billed entity and authorized AP owner, then match the right location code, documents and payment cycle.","checks":["Verify branch coverage and approved AP routing.","Send a scoped invoice or statement package with location identifiers.","Track approval, scheduled runs and funds received as separate statuses."]},{"id":"aging","title":"Aging & account controls","stage":"Account ownership","icon":"◴","color":"#0b897a","sources":["collections","calling","sales"],"summary":"Use the live balance and confirmed terms to prioritize collection, review and escalation.","concept":"An aging export reflects a cutoff. Before calling, reconcile the live balance and screen for payment, return, open delivery ticket, linked replacement and nondelivery. Separate verified, disputed and pending lines.","checks":["Validate the aging bucket against documented terms and date basis.","Collect verified undisputed items and send exceptions to their owner.","Keep promises, credit limit decisions and order release approvals distinct."]},{"id":"delivery","title":"Delivery & freight evidence","stage":"Exceptions","icon":"◇","color":"#3c63ed","sources":["fulfillment","collections","calling"],"summary":"Verify movement, receipt and freight terms before collecting or promising a correction.","concept":"A tracking event may show a transit scan, a failed attempt or only one package. Tie proof of delivery to the actual invoice lines, recipient and location. Dispatch or Fulfillment owns the trace.","checks":["Match tracking or POD with the invoice, line and destination.","Request signed receipt, scan history or item-level evidence as needed.","Route delivery disputes and communicate a verified timeline."]},{"id":"returns","title":"Returns, DTs & warranty","stage":"Exceptions","icon":"↳","color":"#b96928","sources":["sales","fulfillment","calling"],"summary":"Follow a return from authorization to pickup, receiving, DT promotion and credit review.","concept":"A ready pickup, driver collection, yard receipt, promoted delivery ticket and posted credit each answer a different question. Warranty or QC reviews the evidence for a defect or allowance separately from the physical return.","checks":["Link the original, replacement and return records.","Confirm readiness, actual custody and receiving before promising credit.","Use the order terms and route exceptions or warranty evidence to their owner."]},{"id":"handoff","title":"Sales, Accounting & Fulfillment","stage":"Internal coordination","icon":"↔","color":"#7459db","sources":["sales","fulfillment","calling"],"summary":"Turn conflicting notes into a clear handoff with evidence, an owner and a deadline.","concept":"A usable escalation says who, what, when, why and where. Add the proper reference type, requested action and evidence. Price and warranty decisions, part movement, and ledger postings have different approving teams.","checks":["Find the correct quote, work order, invoice or delivery ticket in Powerlink.","Identify the owner for the specific action and give a dated follow-up.","Verify the posted action or physical event before marking the case resolved."]}],"sources":{"collections":{"title":"Collections 11.01.2026","tabs":"Form Responses 1, INVOICES and Fix Auto","description":"Call outcomes, AP routing, evidence requests, invoice fields, settlement status and aging structure."},"calling":{"title":"Call My Customer","tabs":"AR/Calling Sheet","description":"COD and will call exceptions, missing remittance, refunds, contact changes and returned checks."},"sales":{"title":"Sales / Accounting interdepartmental questions","tabs":"AR/Collection Question","description":"Discounts, replacement differences, outstanding DTs, repair allowances and vendor or customer credits."},"fulfillment":{"title":"Fulfillment / Accounting interdepartmental questions","tabs":"Acct questions to Fulfillment and Resolved","description":"Order and part movement, core credit, driver notes, return-to-vendor, and outstanding return promotions."}},"exams":[{"id":"foundation","title":"Core collections","count":20,"pass":80,"modules":["calls","cod","remittance","credits","aging"],"description":"Communication, balance verification, COD, posting and everyday AP follow-up."},{"id":"exceptions","title":"Complex exceptions","count":20,"pass":85,"modules":["refunds","delivery","returns","handoff","corporate"],"description":"Refund safeguards, corporate routing, disputed delivery and interdepartmental decisions."},{"id":"capstone","title":"Agent readiness","count":30,"pass":85,"modules":[],"description":"A balanced run across all ten modules, with critical errors shown separately."}],"scenarios":[{"id":"cod-01","module":"cod","critical":false,"title":"Missed COD at delivery","query":"Your driver dropped it off and didn't ask for money. Why are you calling?","evidence":"Signed delivery record, COD terms and payment ledger.","action":"Confirm delivery and collect the verified open amount through the approved channel.","phrase":"I can see the delivery was completed. Let me confirm what remains open and walk you through the approved payment option.","pitfall":"Assume the driver waived the bill.","owner":"Collections"},{"id":"cod-02","module":"cod","critical":false,"title":"Short cash at the truck","query":"I gave the driver everything I had. Can you tell how much made it back?","evidence":"Driver cash receipt, handoff log and invoice total.","action":"Reconcile cash with Dispatch and Accounting before quoting the residual.","phrase":"Let me match what the driver recorded with what posted. I'll confirm the exact difference before asking you for anything further.","pitfall":"Quote the full invoice again.","owner":"Dispatch"},{"id":"cod-03","module":"cod","critical":false,"title":"Approved slip for a smaller amount","query":"The driver showed me an approved card slip. I thought that paid it all.","evidence":"Captured transaction amount, payment receipt and invoice balance.","action":"Use the settled amount to calculate the balance and offer an approved way to pay it.","phrase":"That receipt helps. I'll match the approved charge to the invoice and confirm whether any balance remains.","pitfall":"Treat an approved receipt as proof of full payment.","owner":"Accounting"},{"id":"cod-04","module":"cod","critical":true,"title":"Declined slip treated as payment","query":"I have a card slip from the truck. It says declined but the driver left the part.","evidence":"Gateway status, delivery record and any later capture.","action":"Check for a successful transaction and, if none posted, offer a secure way to complete payment.","phrase":"I'll check whether a payment actually went through. If it didn't, I can send you our approved payment option.","pitfall":"Run another charge using card details from the slip.","owner":"Collections"},{"id":"cod-05","module":"cod","critical":false,"title":"Yard pickup without collection","query":"I already picked it up at will call. Wasn't it handled at the counter?","evidence":"Pickup release record, counter receipt and posted payments.","action":"Verify the correct pickup and any cashier record before collecting the open total.","phrase":"I'll check the yard release and counter receipt so we can account for anything you paid at pickup.","pitfall":"Use the pickup scan as proof of payment.","owner":"Fulfillment"},{"id":"cod-06","module":"cod","critical":true,"title":"Driver check missing","query":"Your driver took my check. Why should I send another one?","evidence":"Driver receipt, check reference, deposit status and check custody history.","action":"Open a trace and have Accounting direct any replacement or stop-payment coordination.","phrase":"I understand you handed over a check. We'll trace it with Dispatch and Accounting and update you before requesting a replacement.","pitfall":"Ask the shop to issue a new check immediately.","owner":"Accounting"},{"id":"cod-07","module":"cod","critical":false,"title":"Driver-offered damage discount","query":"The part looked rough. Your driver told me I could take a discount.","evidence":"Driver notes, condition photos, quoted price and Sales or QC approval.","action":"Route the promised concession to Sales or QC and distinguish disputed from verified amounts.","phrase":"I'll document what was offered at delivery and have the team review the adjustment before I confirm the amount due.","pitfall":"Approve the alleged discount because it is small.","owner":"Sales / QC"},{"id":"cod-08","module":"cod","critical":false,"title":"COD freight challenged","query":"I'll pay for the part, but nobody told me about shipping.","evidence":"Order confirmation, freight line and any documented waiver.","action":"Verify what Sales quoted and record the disputed freight separately from the agreed part amount.","phrase":"I hear you on the freight. I'll check the original quote and confirm which amount we can resolve today.","pitfall":"Describe a disputed freight charge as an automatic penalty.","owner":"Sales"},{"id":"cod-09","module":"cod","critical":false,"title":"COD moved to a carrier","query":"You changed to a freight carrier. The driver never asked me to pay.","evidence":"Delivery method change, carrier status and payment terms.","action":"Confirm the authorized collection plan and request payment through the approved remote channel at the right stage.","phrase":"When the order moved to a carrier, the payment handoff changed. I'll confirm the current delivery status and the right way for you to pay.","pitfall":"Tell the customer to hand payment to the carrier without an approved arrangement.","owner":"Dispatch"},{"id":"cod-10","module":"cod","critical":false,"title":"COD in transit","query":"Tracking says on the truck. Why are you collecting now?","evidence":"Carrier event, actual delivery and any prepayment terms.","action":"Apply the verified terms and schedule the follow-up at the appropriate milestone.","phrase":"I'll check the order terms and delivery status so I can give you an accurate update on when payment is due.","pitfall":"Mark the item delivered because it is out for delivery.","owner":"Collections"},{"id":"cod-11","module":"cod","critical":false,"title":"Cash pickup on a future route","query":"Can your driver pick up the balance when you collect the return Friday?","evidence":"Dispatch pickup schedule, authorized payment method and approved amount.","action":"Request Dispatch approval, specify the handoff and leave the balance open until posted.","phrase":"I'll check whether Dispatch can arrange that and confirm what the driver is authorized to collect.","pitfall":"Promise the driver will collect cash without Dispatch confirming.","owner":"Dispatch"},{"id":"cod-12","module":"cod","critical":false,"title":"COD store credit smaller than balance","query":"I was told there was enough store credit to cover the whole pickup.","evidence":"Posted available credit, prior applications and eligible account.","action":"Ask Accounting to confirm application and calculate the legitimate remainder.","phrase":"I'll check how much credit is still available. Once Accounting confirms what can be applied, I'll share the remaining balance.","pitfall":"Subtract the face value of an already used credit.","owner":"Accounting"},{"id":"cod-13","module":"cod","critical":false,"title":"Card refund mistaken for store credit","query":"I thought my last refund stayed on the account for this delivery.","evidence":"Refund transaction, original credit and unapplied ledger balance.","action":"Trace the returned funds and confirm whether a separate usable credit actually remains.","phrase":"I'll check whether those funds went back to your card or stayed on the account, then confirm what can be used here.","pitfall":"Apply the same funds as a second credit.","owner":"Accounting"},{"id":"cod-14","module":"cod","critical":false,"title":"Deposit captured once","query":"I paid the deposit twice. Your notes show two entries.","evidence":"Deposit ledger, processor captures and voids or authorizations.","action":"Match each alleged payment to a settled capture and separate any remaining balance.","phrase":"I'll compare the two entries with the actual captures, then send a breakdown showing what posted.","pitfall":"Count two note entries as two payments.","owner":"Accounting"},{"id":"cod-15","module":"cod","critical":false,"title":"Driver queue said charge account","query":"Dispatch told the driver there was nothing to collect because we're on terms.","evidence":"Driver queue notes, payment terms at order release and account approval.","action":"Ask Sales or Accounting to confirm the authorized terms before treating the order as COD.","phrase":"I'll verify the terms on this order and what Dispatch was told. I'll follow up with the confirmed payment instructions.","pitfall":"Convert the account to charge terms yourself.","owner":"Accounting"},{"id":"cod-16","module":"cod","critical":false,"title":"Third party will mail COD funds","query":"The estimator's payment service will mail your check.","evidence":"Authorized payer, invoice routing and approved COD exception.","action":"Confirm payer and terms internally, then log the expected remittance and check date.","phrase":"I can send the invoice to a verified payer. Let me confirm the payment arrangement and what reference they'll need.","pitfall":"Mark it paid when a third party says a check will be mailed.","owner":"Accounting"},{"id":"cod-17","module":"cod","critical":false,"title":"Pay after returning to town","query":"I'm away and can pay when I return next Friday.","evidence":"Verified balance, agreed amount and explicit local date and time.","action":"Record a promise to pay with its confirmed date and set the follow-up.","phrase":"What amount can you take care of next Friday, and what time works for a follow-up if the payment hasn't posted?","pitfall":"Treat an approximate date as a closed collection.","owner":"Collections"},{"id":"cod-18","module":"cod","critical":false,"title":"Part paid but COD core outstanding","query":"I paid for the transmission. I thought returning the old one cleared the rest.","evidence":"Itemized part and core charges, receiving scan and posted core credit.","action":"Tie the remaining line to core evidence before deciding whether to collect.","phrase":"I'll separate the part payment from the core charge and check whether the core was received and credited.","pitfall":"Request the whole invoice balance without checking the core.","owner":"Fulfillment"},{"id":"cod-19","module":"cod","critical":false,"title":"Two packages under one COD order","query":"You delivered only one item. Why would we pay the whole order today?","evidence":"Order lines, delivery events and billed terms for partial delivery.","action":"Ask Fulfillment to confirm the missing line and Accounting to confirm what is payable now.","phrase":"I'll match what arrived to the invoice line by line and confirm the amount that can be resolved today.","pitfall":"Assume one delivery scan covers every line.","owner":"Fulfillment"},{"id":"cod-20","module":"cod","critical":false,"title":"COD collected after outbound call","query":"I just paid via the secure link. Are you going to call me again tomorrow?","evidence":"Payment confirmation, captured status, ledger posting and callback queue.","action":"Verify payment and update or close the callback so the customer is not called again for the same amount.","phrase":"Thanks for taking care of that. I'll confirm it posted and update the follow-up on this invoice.","pitfall":"Close solely from a verbal statement or leave a duplicate reminder active.","owner":"Collections"},{"id":"remittance-01","module":"remittance","critical":false,"title":"Check arrived without remittance","query":"You got our check. I don't know which invoices our bookkeeper put on it.","evidence":"Check reference, payer, amount, date and Accounts Payable contact.","action":"Request the allocation and keep the receipt pending application through Accounting.","phrase":"We received the check. Could your AP team send the invoice-by-invoice breakdown so we apply it as you intended?","pitfall":"Apply to the oldest invoice without evidence or approval.","owner":"Accounting"},{"id":"remittance-02","module":"remittance","critical":false,"title":"ACH without usable invoice reference","query":"Our ACH only shows a batch number. Can you see what it covers?","evidence":"ACH trace, settlement date, payor and batch advice.","action":"Match the bank receipt to the remittance before allocating the payment.","phrase":"I can see the batch reference. Could you send the remittance showing the invoices and amounts it covers?","pitfall":"Guess the allocation from a matching total.","owner":"Accounting"},{"id":"remittance-03","module":"remittance","critical":false,"title":"Payer has no open invoice","query":"Your team says we sent a check, but our open balance is zero.","evidence":"Payer identity, related locations and unapplied receipts.","action":"Check for a related payer or intended account and send unresolved funds to Accounting for disposition.","phrase":"I'll verify the billed account and intended invoices with your AP team before we apply anything.","pitfall":"Recognize the receipt as unrelated revenue.","owner":"Accounting"},{"id":"remittance-04","module":"remittance","critical":false,"title":"Check total conflicts with stub","query":"Our check is for a different total than the invoices listed on the stub.","evidence":"Face amount, stub totals and deductions per invoice.","action":"Identify the discrepancy and request a corrected breakdown from AP.","phrase":"The check and the invoice list total differently. Could you confirm which invoice or adjustment accounts for the difference?","pitfall":"Force the stub totals to equal the check by changing an invoice balance.","owner":"Accounting"},{"id":"remittance-05","module":"remittance","critical":false,"title":"One payment for multiple branches","query":"We paid three locations in one check. Can you clear the statements?","evidence":"Legal payer, location-level invoice list and per-location allocations.","action":"Ask for branch-specific allocation and have Accounting post to the verified accounts.","phrase":"Could you send the branch and invoice breakdown for the check? I'll use it to reconcile each location's statement.","pitfall":"Post it all to the location on the envelope.","owner":"Accounting"},{"id":"remittance-06","module":"remittance","critical":false,"title":"Truncated invoice on remittance","query":"Our software cut off the invoice number. Isn't the amount enough?","evidence":"Full invoice number, date, branch and amount.","action":"Request the missing digits or corroborating details before assigning the receipt.","phrase":"Could you send the full invoice number or the invoice date and location? We have invoices with similar totals.","pitfall":"Match on amount alone.","owner":"Accounting"},{"id":"remittance-07","module":"remittance","critical":false,"title":"Payment advice before settlement","query":"You have the ACH advice, so why does the balance still show open?","evidence":"Bank settlement, scheduled date and ACH reference.","action":"Explain the pending distinction and schedule a posting check.","phrase":"I have the payment advice. I'll verify when the funds settle and update the balance after Accounting posts them.","pitfall":"Close the invoice from the advice alone.","owner":"Accounting"},{"id":"remittance-08","module":"remittance","critical":false,"title":"Corporate AP directed by voicemail","query":"Their voicemail tells vendors to email remittance. What should I send?","evidence":"Verified corporate AP channel, payment reference and invoice request.","action":"Send a narrow, verified remittance request and track the response.","phrase":"I'm following up on a payment reference. Could AP send the invoice breakdown for this batch?","pitfall":"Forward the whole ledger to an address heard once without validating it.","owner":"Collections"},{"id":"remittance-09","module":"remittance","critical":false,"title":"Credit listed but no credit exists","query":"Our ACH advice says we deducted a credit. Why is there still a balance?","evidence":"Credit number, account ledger and sales approval history.","action":"Ask AP for the credit memo and send the difference for research.","phrase":"I see the deduction on your advice. Could you send the credit memo so we can match it to the account?","pitfall":"Create a credit to make the remittance balance.","owner":"Accounting"},{"id":"remittance-10","module":"remittance","critical":false,"title":"Credit used on an earlier ACH","query":"It is the same credit memo we used on our last run. Can you take it again?","evidence":"Original credit, earlier application and current ACH allocation.","action":"Show the prior use to the authorized AP contact and request correction of the short pay.","phrase":"That credit was applied in an earlier payment. I can share the application detail so your team can correct this run.","pitfall":"Reapply the memo because it appears on the new advice.","owner":"Accounting"},{"id":"remittance-11","module":"remittance","critical":false,"title":"Deduction exceeds the approved credit","query":"We took the amount shown in our system. Your credit memo is lower.","evidence":"Issued credit amount, amount deducted and any balance left.","action":"Reconcile the difference and request a revised allocation or payment of the verified remainder.","phrase":"Our posted memo and your deduction differ. I'll share the two amounts so AP can confirm the remaining balance.","pitfall":"Write off the difference automatically.","owner":"Accounting"},{"id":"remittance-12","module":"remittance","critical":false,"title":"Credit applied to the wrong invoice","query":"We used the credit on another invoice. Does it matter?","evidence":"Credit application history, invoice eligibility and payer instructions.","action":"Ask Accounting whether reallocation is permitted and avoid exposing unrelated accounts.","phrase":"Let me trace where the credit landed and confirm whether Accounting can move it to the invoice you intended.","pitfall":"Move a posted credit without approval.","owner":"Accounting"},{"id":"remittance-13","module":"remittance","critical":false,"title":"ACH pays an invoice twice","query":"Two ACH runs included the same invoice. Where did the second payment go?","evidence":"Both settlement references, application dates and unapplied balance.","action":"Verify the duplicate receipt and route disposition to Accounting for approved handling.","phrase":"I'll compare both deposits and confirm where the second payment currently sits.","pitfall":"Promise an immediate refund before checking the receipts.","owner":"Accounting"},{"id":"remittance-14","module":"remittance","critical":false,"title":"Partial payment without explanation","query":"We sent part of it. Can you mark the account paid up?","evidence":"Payment amount, residual by invoice and any dispute or deduction reason.","action":"Record the partial payment and agree on a next step for the remaining items.","phrase":"Thanks for the payment. There's still a balance on the invoice. Is a line under review, or can we agree on a date for the remainder?","pitfall":"Record a partial receipt as full settlement.","owner":"Collections"},{"id":"remittance-15","module":"remittance","critical":false,"title":"Split tender across two dates","query":"Half was paid by card and half by check the following week.","evidence":"Gateway capture, check deposit and invoice applications.","action":"Match each tender separately and report what has settled and posted.","phrase":"I'll trace the card and check separately and confirm the balance after both have posted.","pitfall":"Reject the check because the invoice already has a card payment.","owner":"Accounting"},{"id":"remittance-16","module":"remittance","critical":false,"title":"Unapplied wire from a parent entity","query":"Our parent company wired it under a different name.","evidence":"Bank reference, parent relationship and remittance authorizing application.","action":"Validate the parent relationship and instruct Accounting using the verified references.","phrase":"Could AP send the wire trace and locations it covers? I'll verify the match before the payment is applied.","pitfall":"Apply it to any customer with a similar business name.","owner":"Accounting"},{"id":"remittance-17","module":"remittance","critical":false,"title":"Unmatched vendor balance check","query":"Our vendor payment netted what you owe us. Why is your receivable open?","evidence":"Vendor AR and AP ledgers, remittance and documented offset authorization.","action":"Escalate the proposed two-way offset to Finance and keep both sides traceable.","phrase":"I'll send the proposed offset and statement to Finance so we can confirm how both balances should be handled.","pitfall":"Net AR and AP unilaterally.","owner":"Finance"},{"id":"remittance-18","module":"remittance","critical":false,"title":"Check returned for insufficient funds","query":"Our bank sent back our check. Can we settle with a different method?","evidence":"Bank return reason, reversal status and approved replacement methods.","action":"Verify the reversed payment and agree on an approved replacement method.","phrase":"Accounting confirmed the check was returned. I can help you use an approved replacement payment method for the open balance.","pitfall":"Leave the original receipt applied as settled.","owner":"Accounting"},{"id":"remittance-19","module":"remittance","critical":false,"title":"Check returned for closed account","query":"That business bank account closed last month. Please run the check again.","evidence":"Bank return code, verified payer and approved alternative.","action":"Confirm the return reason and ask for the approved replacement method.","phrase":"Since the bank returned it for a closed account, I'll help you arrange a replacement payment through an approved option.","pitfall":"Automatically redeposit a closed-account check.","owner":"Accounting"},{"id":"remittance-20","module":"remittance","critical":true,"title":"Suspected payment proof alteration","query":"I'll send a screenshot showing we paid. Can you release the order today?","evidence":"Verified source transaction, independent ledger and release authority.","action":"Escalate inconsistent proof and leave release with the authorized owner.","phrase":"I'll use the payment reference to confirm it through our payment records and update you on the order.","pitfall":"Release an order based on an unverified screenshot.","owner":"Finance"},{"id":"credits-01","module":"credits","critical":false,"title":"Invoice-level overpayment","query":"We paid more than that invoice required. Where is the extra?","evidence":"Posted receipt, intended invoice and unapplied balance.","action":"Trace the overpayment and explain the approved options for application or refund review.","phrase":"I'll show what went to the invoice and where the extra payment sits before you decide how you'd like us to review it.","pitfall":"Change the invoice total to absorb the overpayment.","owner":"Accounting"},{"id":"credits-02","module":"credits","critical":false,"title":"Credit posted but not applied","query":"I can see the credit on my statement. Why does the invoice still show due?","evidence":"Open credit, target invoice and application authorization.","action":"Confirm which invoice the customer wants credited and send the application request through Accounting.","phrase":"The memo is on the account. Which invoice did AP intend it to offset? I'll verify the application with Accounting.","pitfall":"Tell the customer the invoice is paid because the account shows a credit.","owner":"Accounting"},{"id":"credits-03","module":"credits","critical":false,"title":"Statement net differs from invoice total","query":"Your email said $620 and our statement shows $515. Which do we pay?","evidence":"Invoice balance, separate credit and statement cutoff.","action":"Explain the invoice and net amounts and confirm the requested application before quoting the payment.","phrase":"The invoice and statement show two different views. I'll break out the posted credit and confirm the amount to remit if it's applied here.","pitfall":"Quote the statement number without reconciling the credit.","owner":"Collections"},{"id":"credits-04","module":"credits","critical":false,"title":"Store credit promised with no memo","query":"Sales told me the credit would cover it. Can you clear the invoice now?","evidence":"Sales notes, authorization and posted memo status.","action":"Request documented approval and separate the promised credit from a posted one.","phrase":"I'll follow up with Sales on the credit they discussed. Once Accounting posts it, I can confirm how it affects the balance.","pitfall":"Reduce the balance from an unverified promise.","owner":"Sales / QC"},{"id":"credits-05","module":"credits","critical":false,"title":"Credit held by a sister location","query":"Our sister shop has an open credit. Can we use that here?","evidence":"Both legal entities, approved account relationship and transfer authority.","action":"Request Finance approval and payer authorization before any transfer.","phrase":"I'll confirm whether the two accounts are eligible for a transfer and what approvals are required.","pitfall":"Move the balance across account numbers yourself.","owner":"Finance"},{"id":"credits-06","module":"credits","critical":false,"title":"Expired-looking credit memo","query":"Our memo is old. Can we still use it?","evidence":"Credit status, prior applications and authorized policy.","action":"Ask Accounting to determine whether it remains available and applicable.","phrase":"I'll verify the memo's current status and confirm how it can be used.","pitfall":"Declare the credit expired solely from its age.","owner":"Accounting"},{"id":"credits-07","module":"credits","critical":false,"title":"Core returned with matching receipt","query":"Here is the yard receipt for my old engine. Why is the core charge still open?","evidence":"Receipt, matching core tag, inspection and invoice application.","action":"Ask Receiving to validate the core and Accounting to post or confirm the credit.","phrase":"That receipt gives me a starting point. I'll match it to the core charge and confirm whether the credit has posted.","pitfall":"Treat a valid receipt as proof the credit already posted.","owner":"Fulfillment"},{"id":"credits-08","module":"credits","critical":false,"title":"Core not picked up by driver","query":"Your driver dropped off the replacement but left the core behind.","evidence":"Core pickup instruction, driver notes and shop readiness.","action":"Ask Dispatch to confirm pickup eligibility and schedule status.","phrase":"I'll check the pickup instructions and what Dispatch needs from your shop to arrange the core return.","pitfall":"Record the core as received because the replacement was delivered.","owner":"Dispatch"},{"id":"credits-09","module":"credits","critical":false,"title":"Wrong core tag at receiving","query":"You received a core, but the one on your receipt isn't linked to us.","evidence":"Core tags, receiving photos and invoice line cross-reference.","action":"Have Receiving trace the item before moving any credit.","phrase":"I'll ask Receiving to match the tag and pickup paperwork to your order before we make a credit adjustment.","pitfall":"Move a credit from another customer's matching part.","owner":"Fulfillment"},{"id":"credits-10","module":"credits","critical":false,"title":"Core used to repair supplied engine","query":"Sales told us to use the old core to fix the unit instead of returning it.","evidence":"Repair authorization, inspection notes and the original core charge.","action":"Request written Sales or QC confirmation of the exception before adjustment.","phrase":"I'll review the repair instructions with Sales and QC to see how they affect the core charge.","pitfall":"Treat retaining the core as an automatic waiver.","owner":"Sales / QC"},{"id":"credits-11","module":"credits","critical":false,"title":"Restocking deduction omitted by AP","query":"Our remittance took the full return credit. Why is there a difference?","evidence":"Issued credit, return terms and approved restocking adjustment.","action":"Share the authorized breakdown and route any fee dispute for review.","phrase":"The issued credit includes an adjustment. I can send the breakdown and ask the team to review any disputed line.","pitfall":"Call the deduction valid without checking the approved terms.","owner":"Sales / QC"},{"id":"credits-12","module":"credits","critical":false,"title":"Sales offered a post-sale discount","query":"We paid less because your salesperson agreed to take something off.","evidence":"Quote, messages and formal adjustment approval.","action":"Log the claimed discount and route validation before collecting the disputed amount.","phrase":"I'll verify the discount discussed with Sales and get back to you with the confirmed balance.","pitfall":"Record a concession yourself based on the customer's recollection.","owner":"Sales"},{"id":"credits-13","module":"credits","critical":false,"title":"Tax-only balance with resale certificate","query":"We left the tax off because we're a reseller.","evidence":"Invoice tax line, legal entity, certificate status and effective date.","action":"Route certificate validation and any tax adjustment to Accounting.","phrase":"I'll send the certificate through our review process and confirm whether the tax line can be adjusted.","pitfall":"Remove tax from the invoice yourself.","owner":"Accounting"},{"id":"credits-14","module":"credits","critical":false,"title":"Reseller permit appears inactive","query":"The permit is already on file. Why do you need it again?","evidence":"Account entity, certificate on file and Accounting validation status.","action":"Ask for the approved document through the verified channel and let Accounting determine applicability.","phrase":"The document on file needs review. Could your AP team provide the current certificate through our approved channel?","pitfall":"Accept a permit from a different company as equivalent.","owner":"Accounting"},{"id":"credits-15","module":"credits","critical":false,"title":"Credit memo references original invoice","query":"The credit was issued on the old order. Can I deduct it from the replacement?","evidence":"Original and replacement linkage plus remaining memo balance.","action":"Verify the credit remains usable and get Accounting's application direction.","phrase":"I'll trace the memo from the original to the replacement and confirm whether it can be applied there.","pitfall":"Deduct the memo from both invoices.","owner":"Accounting"},{"id":"credits-16","module":"credits","critical":false,"title":"Repair allowance awaiting documentation","query":"We deducted the shop's repair labor. They fixed it in-house.","evidence":"Repair estimate, written allowance and approval status.","action":"Send the requested evidence to the approval owner and keep the deduction pending review.","phrase":"Could you share the repair breakdown and any written approval? I'll have the team confirm the amount eligible for review.","pitfall":"Treat a shop-created repair bill as approved.","owner":"Sales / QC"},{"id":"credits-17","module":"credits","critical":false,"title":"Credit for only one returned line","query":"We sent back one of the two lamps. Why didn't you credit the whole invoice?","evidence":"Return intake, item quantities and line-level credit.","action":"Confirm the returned line and reconcile any remaining charge separately.","phrase":"The return record covers one line. I'll verify that credit and show what remains on the other item.","pitfall":"Credit both lines because the carton came back.","owner":"Accounting"},{"id":"credits-18","module":"credits","critical":false,"title":"Credit posted to a legacy account","query":"Our credit is on an account we no longer use.","evidence":"Legacy and active account histories and legal identity verification.","action":"Have Accounting confirm ownership and authorized transfer or application.","phrase":"I'll verify the account history and ask Accounting what can be done with the open memo.","pitfall":"Merge the accounts or move the credit without review.","owner":"Accounting"},{"id":"credits-19","module":"credits","critical":false,"title":"Credit memo exists with zero usable balance","query":"Your PDF says the credit was issued. Why can't we use it now?","evidence":"Credit face value, applications and current available balance.","action":"Explain where the memo was used and identify any remaining valid credit.","phrase":"The memo was issued, and the application history shows what used it. I'll send the relevant breakdown to your verified AP contact.","pitfall":"Treat the PDF's face value as today's available credit.","owner":"Accounting"},{"id":"credits-20","module":"credits","critical":false,"title":"Small residual requested as write-off","query":"It's a few dollars. Can you just close it for us?","evidence":"Residual cause, invoice history and approval limits.","action":"Document the reason and obtain authorized disposition before clearing anything.","phrase":"I'll check why the balance remains and route your request for the appropriate decision.","pitfall":"Write it off because it is below an assumed threshold.","owner":"Finance"},{"id":"refunds-01","module":"refunds","critical":true,"title":"Refund payee does not match ledger","query":"The refund request shows a different name. Can you just print it that way?","evidence":"Original payer, posted credit, approved refund request and verified account contact.","action":"Pause the request and confirm the discrepancy through the approved callback channel.","phrase":"Before the refund moves forward, I need to verify the original payer and the approved name for the check.","pitfall":"Use the new name in an unverified request.","owner":"Finance"},{"id":"refunds-02","module":"refunds","critical":true,"title":"Refund mailing address changed","query":"We moved last month. Please mail the refund to this new address.","evidence":"Registered contact, approved address-change verification and refund status.","action":"Verify the address through the approved process and have Finance update the request.","phrase":"I'll verify the mailing address through our established contact and ask Finance to confirm where the check should go.","pitfall":"Change the address from an unsolicited message.","owner":"Finance"},{"id":"refunds-03","module":"refunds","critical":true,"title":"Suspicious refund destination","query":"Send the refund to my friend's payment account. I'm the one handling it.","evidence":"Original payment method, verified payer and approved refund instructions.","action":"Escalate the destination change and leave the refund on hold for review.","phrase":"I can help get the refund reviewed for the verified payer through our approved channel.","pitfall":"Accept alternate destination details from the caller.","owner":"Finance"},{"id":"refunds-04","module":"refunds","critical":false,"title":"Refund pickup at the yard","query":"Can I collect the refund check at the yard on Friday?","evidence":"Approved pickup location, check availability and authorized recipient.","action":"Confirm the pickup plan with Finance and give only verified logistics.","phrase":"I'll confirm the check is ready, where it can be picked up, and what the approved recipient needs to bring.","pitfall":"Tell the customer to drive to the yard before confirming the check.","owner":"Finance"},{"id":"refunds-05","module":"refunds","critical":false,"title":"Refund check issued but uncashed","query":"Your check arrived. Do I need to call after I deposit it?","evidence":"Issue status, ledger and customer's reported receipt.","action":"Record receipt confirmation and leave clearing status to Finance.","phrase":"Thanks for confirming you have it. I'll update the file and verify the clearing status through Accounting if needed.","pitfall":"Mark it cleared because the customer has it.","owner":"Accounting"},{"id":"refunds-06","module":"refunds","critical":true,"title":"Refund check customer says never arrived","query":"I never received it. Send another one today.","evidence":"Mailing record, verified address and clearing or stop-payment status.","action":"Trace the original with Finance before discussing reissue timing.","phrase":"I'll trace the original check and verify the mailing details. Finance can then confirm the next step.","pitfall":"Reissue before the original check is accounted for.","owner":"Finance"},{"id":"refunds-07","module":"refunds","critical":false,"title":"Refund check bounced","query":"Your refund check was returned by my bank. What should I do?","evidence":"Returned check record, bank reason and Finance instructions.","action":"Have Finance determine whether to redeposit or reissue and communicate the authorized path.","phrase":"I'll confirm the reason with Finance and let you know whether they want you to redeposit it or wait for a replacement.","pitfall":"Promise immediate redeposit without checking the reason.","owner":"Finance"},{"id":"refunds-08","module":"refunds","critical":false,"title":"Refund check reported already cashed","query":"I found the envelope, but your system says the check cleared.","evidence":"Bank clearing evidence, issued payee and identity verification.","action":"Send the conflict for Finance review through the appropriate channel.","phrase":"I'll ask Finance to verify the cleared item and contact you through our verified channel with the next step.","pitfall":"Read the check endorsement to an unverified caller.","owner":"Finance"},{"id":"refunds-09","module":"refunds","critical":false,"title":"Refund check stale or voided","query":"I found an old check in a drawer. Can I still deposit it?","evidence":"Check date, void status, bank instructions and Finance decision.","action":"Verify whether the item should be replaced before advising deposit.","phrase":"Let me check the status with Finance before you try to deposit the old check.","pitfall":"Say any issued business check will clear indefinitely.","owner":"Finance"},{"id":"refunds-10","module":"refunds","critical":false,"title":"Refund card processor shows completed","query":"The refund receipt says complete, but I don't see money in my bank.","evidence":"Refund transaction date, original tender and supported trace reference.","action":"Share verified refund confirmation and route unresolved posting delay for trace.","phrase":"I'll confirm the refund date and reference from our processor so you can check it with your card issuer.","pitfall":"Guarantee the issuer's posting date.","owner":"Accounting"},{"id":"refunds-11","module":"refunds","critical":true,"title":"Original card replaced","query":"That card was reissued. Can you send the refund to my new card?","evidence":"Original tender, processor refund status and approved exception process.","action":"Consult the payment owner about the original route and valid exceptions.","phrase":"I'll check how the processor handles a refund to the original account when the card has been replaced.","pitfall":"Collect the new card details in the call log.","owner":"Finance"},{"id":"refunds-12","module":"refunds","critical":false,"title":"Refund expected above posted credit","query":"We were promised $840. Your credit is only $600.","evidence":"Original invoice, posted credit and any separate approved allowance.","action":"Reconcile the component amounts with Sales or QC before giving a refund total.","phrase":"I see the posted credit. I'll verify whether there was a separate approved adjustment and confirm the total after review.","pitfall":"Promise the amount the customer remembers.","owner":"Sales / QC"},{"id":"refunds-13","module":"refunds","critical":false,"title":"Refund and labor reimbursement combined","query":"Can you send one refund covering the engine and my installer?","evidence":"Merchandise credit, labor authorization and warranty documentation.","action":"Review each component with its owner and communicate their separate statuses.","phrase":"I'll check the part credit and the labor request separately so you know where each stands.","pitfall":"Assume the merchandise refund also approves labor.","owner":"Warranty / QC"},{"id":"refunds-14","module":"refunds","critical":false,"title":"Pending refund on canceled will call","query":"I canceled before pickup. Why haven't I received my deposit back?","evidence":"Cancellation approval, pickup release status and refund ledger.","action":"Verify the canceled order and whether a refund has been approved or entered.","phrase":"I'll confirm the cancellation and check whether your deposit refund has been entered. I'll follow up with the verified status.","pitfall":"Treat cancellation notes alone as proof that funds moved.","owner":"Sales / QC"},{"id":"refunds-15","module":"refunds","critical":false,"title":"Refund requested before physical return","query":"I need the money first. You can take the part later.","evidence":"Return authorization, pickup or receiving status and the applicable terms.","action":"Explain the verified return and inspection steps and escalate requests for an exception.","phrase":"I'll check the authorized return steps. Once receiving confirms the part is back, the team can review the refund under the order terms.","pitfall":"Commit to refunding before receiving confirms the return.","owner":"Sales / QC"},{"id":"refunds-16","module":"refunds","critical":false,"title":"Pickup attempt refused pending refund","query":"The driver came, but I kept the unit because I wanted the refund first.","evidence":"Driver attempt log, return authorization and approved refund path.","action":"Document the refusal neutrally and have the return owner arrange next steps after agreement.","phrase":"Dispatch recorded a pickup attempt. If the unit is ready to release, I can ask the team to review rescheduling and explain the refund review steps.","pitfall":"Describe the unit as returned after an unsuccessful pickup.","owner":"Dispatch"},{"id":"refunds-17","module":"refunds","critical":true,"title":"Possible duplicate refund request","query":"Two people at our shop submitted the same refund request. Can you check?","evidence":"Both request references and issued or pending disbursement ledger.","action":"Link both requests to one review and stop duplicate processing through Finance.","phrase":"I'll match both requests to the original credit so Finance can verify whether anything has already been issued.","pitfall":"Process two refunds because there are two emails.","owner":"Finance"},{"id":"refunds-18","module":"refunds","critical":true,"title":"Alternate payout details arrive in chat","query":"I messaged a new payout handle to your salesperson. Use that instead.","evidence":"Original tender, verified requester and approved payment channels.","action":"Treat chat as unverified intake and route it through Finance's verification process.","phrase":"I'll pass along that the payout details changed. Finance will verify any approved change through the established contact.","pitfall":"Forward payment details over a personal chat or enter them in the training notes.","owner":"Finance"},{"id":"refunds-19","module":"refunds","critical":true,"title":"Chargeback open during refund request","query":"I filed a dispute. Can you also refund me directly right now?","evidence":"Active dispute, processor case and approved refund handling.","action":"Send the request to the dispute owner to avoid duplicate recovery and report the confirmed next step.","phrase":"I'll have our disputes team verify the case and confirm the correct resolution path for this payment.","pitfall":"Issue or promise a separate refund while the dispute is unresolved.","owner":"Chargebacks"},{"id":"refunds-20","module":"refunds","critical":false,"title":"Refund timing for an approved batch","query":"You said next week. Can you guarantee which day the check gets here?","evidence":"Finance approval, scheduled mail date and normal delivery uncertainty.","action":"Communicate the verified issue or mail status and offer a check-in point.","phrase":"I can confirm our scheduled mailing date. I'll follow up if Finance's status changes or the check hasn't arrived by the agreed check-in.","pitfall":"Guarantee mail delivery on a particular date.","owner":"Finance"},{"id":"calls-01","module":"calls","critical":true,"title":"Accounting person on leave","query":"Our bookkeeper is out for a week. Can you send the invoices to me?","evidence":"Caller authorization, verified backup AP contact and preferred channel.","action":"Confirm who can receive documents and set a specific follow-up time.","phrase":"Who is covering AP this week? Once I verify the contact, I can send the invoice copies and schedule a check-in.","pitfall":"Read balances or send invoices to an unverified employee.","owner":"Collections"},{"id":"calls-02","module":"calls","critical":false,"title":"AP available only on Mondays","query":"Accounting only works Mondays. Why do you keep calling the front desk?","evidence":"AP schedule, verified number and contact preference.","action":"Set the AP callback for the agreed Monday window and update the account notes.","phrase":"Thanks for letting me know. What's the best time on Monday to reach AP directly?","pitfall":"Set another front desk call for tomorrow.","owner":"Collections"},{"id":"calls-03","module":"calls","critical":false,"title":"Shop requests email as the primary route","query":"We don't handle accounting by phone. Email AP.","evidence":"Verified accounts payable mailbox and scope of authorized disclosure.","action":"Send an invoice-specific email and record the preferred channel.","phrase":"I'll route this to your verified AP mailbox. Can you confirm the reference your team uses in the subject line?","pitfall":"Continue daily payment calls to the shop reception.","owner":"Collections"},{"id":"calls-04","module":"calls","critical":true,"title":"Published alternate belongs to another business","query":"This number doesn't belong to that repair shop. Why are you calling me?","evidence":"Account contact record and reliable source for a verified replacement.","action":"Stop that contact path, document the wrong number and verify an alternate.","phrase":"Thanks for letting me know. I'll update our records for this number.","pitfall":"Disclose the account balance to find out if they know the shop.","owner":"Collections"},{"id":"calls-05","module":"calls","critical":false,"title":"Disconnected number with an open invoice","query":"The main number is disconnected. How do I contact the payer?","evidence":"Latest verified contact, account owner history and approved alternate channel.","action":"Research authorized contacts and move to a verified email or internal owner.","phrase":"I'm reaching out from Benzeen Auto Parts. Could your verified AP contact let us know the best way to reach them?","pitfall":"Use the first online result without verifying it.","owner":"Collections"},{"id":"calls-06","module":"calls","critical":true,"title":"Voicemail for an unverified extension","query":"I reached a generic mailbox. What can I leave?","evidence":"Contact verification and approved voicemail script.","action":"Leave only an approved callback message where appropriate and log the attempt.","phrase":"Hi, this is Collections with Benzeen Auto Parts. Please call us back through our business number when convenient.","pitfall":"Read out balances, card information or account issues in the voicemail.","owner":"Collections"},{"id":"calls-07","module":"calls","critical":false,"title":"Receptionist asks why you are calling","query":"What's this about? I can take the message for the owner.","evidence":"Caller role, authorization and verified payables contact.","action":"Give a limited purpose and request the authorized AP handoff.","phrase":"It's an invoice follow-up for your AP team. Who handles vendor invoices for this location?","pitfall":"Provide account details to get a faster transfer.","owner":"Collections"},{"id":"calls-08","module":"calls","critical":false,"title":"Customer requests Spanish support","query":"Can I speak with someone in Spanish about my payment?","evidence":"Approved language support and verified callback availability.","action":"Warm-transfer or schedule a callback with an authorized bilingual colleague.","phrase":"Claro. Puedo pedir que un compañero autorizado le atienda en español. ¿Qué horario le conviene?","pitfall":"Ask an unverified third party to interpret payment details.","owner":"Collections"},{"id":"calls-09","module":"calls","critical":false,"title":"Customer is driving","query":"I'm driving. Can we take care of this now?","evidence":"Call safety, agreed callback window and approved secure payment option.","action":"End the live payment discussion and arrange a safe callback.","phrase":"Of course. What time should I call when you're parked and able to review the invoice?","pitfall":"Keep pressing for immediate card information.","owner":"Collections"},{"id":"calls-10","module":"calls","critical":false,"title":"Customer asks for invoice proof before paying","query":"Send the invoice first. I can't approve a payment from a phone call.","evidence":"Correct invoice copy, verified recipient and scheduled review.","action":"Send the scope requested and set a follow-up tied to the review.","phrase":"I'll send the invoice to your verified AP contact. When would be a good time to check whether they have everything they need?","pitfall":"Treat the request for a copy as a refusal to pay.","owner":"Collections"},{"id":"calls-11","module":"calls","critical":false,"title":"AP requests an open-invoice statement","query":"Can you send only what's open across the accounts I'm authorized for?","evidence":"Verified account scope, statement date and current balances.","action":"Send the scoped open-item statement and offer invoice copies if needed.","phrase":"I'll send the open-item statement for the verified locations and include the statement date.","pitfall":"Send histories for every account that shares the brand name.","owner":"Collections"},{"id":"calls-12","module":"calls","critical":false,"title":"Multiple calls frustrated the customer","query":"I've explained this to three people. Can you stop calling me about the same invoice?","evidence":"Existing callbacks, dispute status and assigned case owner.","action":"Consolidate ownership and set one agreed follow-up after fact-checking.","phrase":"I can see why that was frustrating. I'll review the existing notes and coordinate a single follow-up with you.","pitfall":"Start another parallel callback chain.","owner":"Collections"},{"id":"calls-13","module":"calls","critical":false,"title":"Vague promise to pay","query":"I'll pay soon. Just give me more time.","evidence":"Open amount, amount they can pay and credible payment date.","action":"Ask for a specific amount, method and date with a documented check-in.","phrase":"What amount can you commit to, and what date should I note for that payment?","pitfall":"Record soon as a firm promise date.","owner":"Collections"},{"id":"calls-14","module":"calls","critical":false,"title":"Missed payment promise","query":"I said Friday, but the check didn't go out. Can you call next week?","evidence":"Original promise, settlement records and revised proposed date.","action":"Verify no receipt, record the missed commitment and agree a revised date.","phrase":"I checked for the Friday payment. What date can AP confirm now, and will the remittance come with it?","pitfall":"Overwrite the old commitment so the previous miss disappears.","owner":"Collections"},{"id":"calls-15","module":"calls","critical":false,"title":"Cash-flow request for installments","query":"We can't pay everything at once. Can you set up installments?","evidence":"Verified balances, amount and dates proposed, and approval authority.","action":"Record the request and obtain Finance approval before committing terms.","phrase":"What amount could you send now, and on what dates could you handle the rest? I'll bring the proposal to Finance.","pitfall":"Agree binding payment terms on your own.","owner":"Finance"},{"id":"calls-16","module":"calls","critical":false,"title":"Customer disputes collector identity","query":"How do I know you're really calling from Benzeen?","evidence":"Official business contact and verified self-initiated callback route.","action":"Offer an independently verifiable way to reconnect and avoid requesting sensitive details.","phrase":"You're welcome to call our published business number and ask for Collections. We can continue from there.","pitfall":"Pressure the caller to verify with their card information.","owner":"Collections"},{"id":"calls-17","module":"calls","critical":false,"title":"Customer disconnects after saying they will pay","query":"I'll make the payment. Goodbye.","evidence":"Actual payment status, prior contact cadence and any offered method.","action":"Log the statement accurately and set a reasonable verification follow-up.","phrase":"I heard that you plan to pay. When we reconnect, I can confirm the invoice and payment option with you.","pitfall":"Mark the account paid from the disconnected call.","owner":"Collections"},{"id":"calls-18","module":"calls","critical":false,"title":"Customer disputes the shop's authority","query":"I'm the service writer. I don't have approval to talk balances.","evidence":"Role, authorized AP contact and permitted disclosure.","action":"Thank the caller and route to the verified authorized contact.","phrase":"Thanks for letting me know. Who in AP should I reach out to for this invoice?","pitfall":"Try to obtain payment authorization from the service writer.","owner":"Collections"},{"id":"calls-19","module":"calls","critical":true,"title":"AP requests documents at a corrected address","query":"The last email bounced. Use the address I just gave you.","evidence":"Bounce reason, known account contact and independent address verification.","action":"Verify the corrected AP mailbox before resending scoped documents.","phrase":"I'll confirm the updated address through our established contact and resend the requested invoice once verified.","pitfall":"Immediately forward the statement to the new address.","owner":"Collections"},{"id":"calls-20","module":"calls","critical":false,"title":"Customer objects to further calls","query":"Please stop calling this number. Use our AP email only.","evidence":"Contact preference, authorized email and applicable escalation guidance.","action":"Log the request, update channel routing and ask a lead to review any broader restrictions.","phrase":"I'll document that request and route the follow-up through the verified AP channel.","pitfall":"Continue dialing the same number while waiting for a reply.","owner":"Collections"},{"id":"corporate-01","module":"corporate","critical":false,"title":"Corporate collision chain owns payment","query":"We're a Crash Champions-style location. Corporate handles your checks.","evidence":"Verified corporate relationship, branch code and AP routing notes.","action":"Confirm the corporate owner and send the branch-specific items to verified AP.","phrase":"Thanks for confirming. I'll send the invoice details to your corporate AP team with the location reference they need.","pitfall":"Ask the location to pay a corporate-owned balance on the spot.","owner":"Collections"},{"id":"corporate-02","module":"corporate","critical":false,"title":"Four locations with one retail bookkeeper","query":"I pay for four shops, but each one has a separate vendor statement.","evidence":"Verified coverage and account-to-location crosswalk.","action":"Send a clear location breakdown to the authorized bookkeeper.","phrase":"I'll group the open items by shop so you can reconcile each location on its own statement.","pitfall":"Treat every location as one legal entity.","owner":"Collections"},{"id":"corporate-03","module":"corporate","critical":false,"title":"One franchise location pays independently","query":"The other stores use corporate, but we pay our own invoices.","evidence":"Branch ownership, billing profile and exceptions list.","action":"Verify the local exception and update payer routing for that branch.","phrase":"I'll confirm the payment setup for your location and make sure the invoices go to the right AP contact.","pitfall":"Automatically route to corporate because the shop brand matches.","owner":"Collections"},{"id":"corporate-04","module":"corporate","critical":false,"title":"Corporate AP works Central hours","query":"Our payment team starts and closes earlier than your California office.","evidence":"Verified AP hours and time zone.","action":"Schedule a specific window in the payer's time zone and record its Pacific equivalent.","phrase":"What time is best for AP in Central time? I'll put both the local and Pacific time in my follow-up.","pitfall":"Log a callback time without its time zone.","owner":"Collections"},{"id":"corporate-05","module":"corporate","critical":false,"title":"Corporate payment run after a cutoff","query":"Our AP team only releases ACH after the twentieth.","evidence":"Payment calendar, approved invoices and documented date.","action":"Confirm eligibility and schedule the follow-up after the promised run.","phrase":"Which of these invoices are approved for that run, and what date should I note for the remittance?","pitfall":"Keep calling every location before the agreed run without a new issue.","owner":"Collections"},{"id":"corporate-06","module":"corporate","critical":false,"title":"One branch missing from corporate batch","query":"Corporate paid the other locations. Why was ours skipped?","evidence":"Batch remittance, location or supplier code and AP exception reason.","action":"Ask corporate AP for the excluded branch's reason and next eligible cycle.","phrase":"I matched the other locations. Could AP confirm why this branch was excluded and when it can be reviewed?","pit
