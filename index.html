fall":"Spread the other branches' payment across the missing invoice.","owner":"Accounting"},{"id":"corporate-07","module":"corporate","critical":false,"title":"Regional escalation for overdue approvals","query":"The branch approved it. The regional office is holding the invoice.","evidence":"Approval chain, dated contacts and unresolved exception.","action":"Escalate through the approved regional route with a focused invoice summary.","phrase":"I'll share the invoice history through the verified regional AP route and ask what is holding approval.","pitfall":"Escalate to an unrelated location or copy unverified recipients.","owner":"Collections Lead"},{"id":"corporate-08","module":"corporate","critical":false,"title":"Corporate check issued but not received","query":"Corporate says a check went out last Wednesday. We haven't seen anything.","evidence":"Check reference, issue date, mailing destination and clearing status.","action":"Ask for trace details and route the missing payment to Accounting.","phrase":"Could AP confirm the check reference and mailing date? I'll check our receipt records and follow up if it hasn't arrived.","pitfall":"Tell AP to stop payment before Accounting checks receipt.","owner":"Accounting"},{"id":"corporate-09","module":"corporate","critical":false,"title":"AP needs purchase order on invoice","query":"We can't process this until the purchase order is on the invoice.","evidence":"PO, customer document specification and order record.","action":"Ask Sales or Accounting to correct the approved document and preserve its audit history.","phrase":"Please confirm the PO reference. I'll check how we can get it onto the right invoice copy for AP.","pitfall":"Edit an official invoice PDF manually.","owner":"Sales"},{"id":"corporate-10","module":"corporate","critical":false,"title":"Invoice indexed to the wrong corporate location","query":"Your invoice is in the portal under a shop we don't own.","evidence":"Portal routing, real order destination and legal payer.","action":"Verify the account and have the portal owner correct the submission.","phrase":"I'll check the buyer and store reference, and we'll route the invoice to the right AP account once verified.","pitfall":"Demand payment from the location displayed in the portal.","owner":"Accounting"},{"id":"corporate-11","module":"corporate","critical":true,"title":"Corporate AP requests a vendor ID","query":"We have two vendor profiles for Benzeen. Which one should we use?","evidence":"Authorized vendor setup, invoice payee and established AP contact.","action":"Confirm the valid vendor profile with Finance and clean up the routing request.","phrase":"I'll confirm the vendor profile with Finance so your team can match the invoice to the correct record.","pitfall":"Share banking details over an unverified email chain.","owner":"Finance"},{"id":"corporate-12","module":"corporate","critical":false,"title":"Duplicate shop accounts under a single owner","query":"Both accounts are ours. Can I get one statement and one balance?","evidence":"Account IDs, ownership and duplicate-account review status.","action":"Verify the legal identity and route consolidation or scoped statements to Accounting.","phrase":"I'll confirm both accounts against your authorized profile and check how Accounting wants the balances presented.","pitfall":"Merge records because the addresses match.","owner":"Accounting"},{"id":"corporate-13","module":"corporate","critical":false,"title":"New owner at a closed shop","query":"We bought the building and reopened. Those invoices are from the old business.","evidence":"Legal entities, ownership change date and order history.","action":"Escalate legacy balances and review new orders under the new entity's verified setup.","phrase":"I'll separate the old invoices from your new account setup and have Accounting review each under the correct business name.","pitfall":"Assign the prior owner's debt to the new shop automatically.","owner":"Finance"},{"id":"corporate-14","module":"corporate","critical":false,"title":"Corporate portal says paid but bank shows no deposit","query":"Our portal marks it paid. Why is your statement still open?","evidence":"Portal status, bank reference and actual settlement date.","action":"Request payment trace details and reconcile the portal event with ledger posting.","phrase":"The portal shows a payment status. Could AP provide the trace so Accounting can match it to the deposit?","pitfall":"Close from the portal label alone.","owner":"Accounting"},{"id":"corporate-15","module":"corporate","critical":false,"title":"Shared mailbox auto-acknowledgment only","query":"We got an automatic ticket. Does that mean corporate approved our invoice?","evidence":"Ticket acknowledgment, AP queue stage and approval response.","action":"Distinguish receipt from approval and set a ticket-based follow-up.","phrase":"The ticket confirms AP received the request. I'll follow up on that ticket for the actual approval status.","pitfall":"Mark the invoice approved because the mailbox responded.","owner":"Collections"},{"id":"corporate-16","module":"corporate","critical":false,"title":"Corporate payer requests a pause in local calls","query":"We told the shops not to discuss balances. Can you work through corporate only?","evidence":"Authorized corporate instruction, branch coverage and callback schedule.","action":"Document the approved channel and move covered follow-ups to corporate.","phrase":"I'll confirm which locations your team covers and route their invoice follow-ups to your verified AP channel.","pitfall":"Suppress follow-ups for every franchise before checking scope.","owner":"Collections Lead"},{"id":"corporate-17","module":"corporate","critical":false,"title":"PartsTrader invoice awaiting buyer approval","query":"It's in PartsTrader, but the buyer hasn't approved it yet.","evidence":"Platform status, assigned buyer and applicable invoice evidence.","action":"Identify who owns platform approval and request the missing action.","phrase":"I'll verify the buyer and status in PartsTrader and send the invoice details through the approved route.","pitfall":"Treat a submitted platform invoice as a paid balance.","owner":"Collections"},{"id":"corporate-18","module":"corporate","critical":false,"title":"CCC reference differs from invoice","query":"Your CCC record doesn't match the repair order we pay against.","evidence":"Portal reference, repair order and invoice cross-reference.","action":"Validate the linkage and ask the platform owner to update or clarify it.","phrase":"Could you confirm the repair order you see? I'll match it to our invoice and coordinate any correction.","pitfall":"Change the payer solely from the portal description.","owner":"Sales"},{"id":"corporate-19","module":"corporate","critical":false,"title":"Shop says insurer will pay directly","query":"Insurance approved the job. You'll have to collect from them.","evidence":"Buyer of record, authorized direct-pay arrangement and claim documentation.","action":"Verify any approved third-party arrangement and clarify the billed party.","phrase":"I'll check the order for any approved direct-pay arrangement and confirm how the invoice was billed.","pitfall":"Move liability to the insurer on a verbal statement.","owner":"Finance"},{"id":"corporate-20","module":"corporate","critical":false,"title":"Check pays one account, note claims all locations cleared","query":"The check memo says it covers everything across our group.","evidence":"Remittance, authorized accounts and location residuals.","action":"Report the actual allocations and request details for uncovered items.","phrase":"I'll reconcile the receipt by location and point out any open invoices that aren't on the remittance.","pitfall":"Close all branches from a broad check memo.","owner":"Accounting"},{"id":"aging-01","module":"aging","critical":false,"title":"Current invoice courtesy reminder","query":"It isn't past due. Why are you calling already?","evidence":"Invoice date, approved terms and actual due date.","action":"Use a light-touch receipt check and reserve a demand for a verified past-due item.","phrase":"I'm checking that AP received the invoice and has what it needs to process it by the due date.","pitfall":"Describe a current balance as delinquent.","owner":"Collections"},{"id":"aging-02","module":"aging","critical":false,"title":"Invoice due date versus statement date","query":"We pay 30 days from the statement, so this isn't late.","evidence":"Approved account terms, invoice date and statement date.","action":"Validate the applicable terms and explain the date calculation without changing terms.","phrase":"I'll confirm which date your account terms use and send AP the due-date breakdown.","pitfall":"Assert a blanket 30-day rule without checking the approved terms.","owner":"Collections"},{"id":"aging-03","module":"aging","critical":false,"title":"Thirty-day bucket payment commitment","query":"We can send something this week. What do you need from us?","evidence":"Verified past-due items, partial amount and intended allocation.","action":"Ask for specific invoices, committed amount and payment date.","phrase":"Which invoices can AP cover this week, and what payment date should I put in the follow-up?","pitfall":"Log the account as paid when only a commitment exists.","owner":"Collections"},{"id":"aging-04","module":"aging","critical":false,"title":"Over-60 balance with one disputed invoice","query":"One invoice is wrong. We're holding everything.","evidence":"Invoice-level aging, dispute reason and undisputed balances.","action":"Route the disputed line and ask which undisputed invoices AP can pay.","phrase":"Let's review the disputed invoice separately. Which of the other open items can AP include in its next run?","pitfall":"Demand payment of the disputed invoice as a condition for review.","owner":"Collections"},{"id":"aging-05","module":"aging","critical":false,"title":"Over-90 repeated missed promises","query":"We missed the last two dates. We're still waiting for cash.","evidence":"Follow-up timeline, promise amounts and currently undisputed aging.","action":"Escalate to the lead with documented misses and request a realistic next action.","phrase":"We've recorded two missed payment dates. What dates and amounts can AP realistically confirm now?","pitfall":"Threaten a penalty or hold you cannot authorize.","owner":"Collections Lead"},{"id":"aging-06","module":"aging","critical":false,"title":"Over-120 unsupported legacy balance","query":"Nobody here remembers that old invoice. Can you prove the balance?","evidence":"Original invoice, fulfillment evidence and payment or credit history.","action":"Assemble the evidence and escalate gaps before continuing collection.","phrase":"I'll pull the invoice and its payment and delivery history, then send the verified record to your AP contact.","pitfall":"Rely on the aging bucket as standalone proof.","owner":"Finance"},{"id":"aging-07","module":"aging","critical":false,"title":"Settled flag with nonzero open amount","query":"Your system says settled and also shows an amount due.","evidence":"Settled indicator, application history and current ledger.","action":"Send the conflicting state to Accounting and confirm before collection.","phrase":"I see conflicting status fields. I'll have Accounting reconcile them and get back to you with the confirmed balance.","pitfall":"Choose the amount due field without checking posting history.","owner":"Accounting"},{"id":"aging-08","module":"aging","critical":false,"title":"Zero-balance invoice still open","query":"The invoice is open for zero. Do we owe anything on it?","evidence":"Invoice detail, balance due and pending adjustments.","action":"Confirm there is no collectible balance and route the open status for cleanup if needed.","phrase":"This invoice currently shows a zero balance. I'll verify whether Accounting needs to close the status.","pitfall":"Start a collection call for a zero amount.","owner":"Accounting"},{"id":"aging-09","module":"aging","critical":false,"title":"Paid after aging snapshot","query":"Your statement is from before the ACH. Why is it on the list?","evidence":"Statement cutoff, payment posting date and live open balance.","action":"Compare snapshot with the live ledger and resend a refreshed view if appropriate.","phrase":"That statement was pulled before the payment posted. I'll confirm the live balance and send you the updated view.","pitfall":"Treat the month-start export as more current than the live ledger.","owner":"Collections"},{"id":"aging-10","module":"aging","critical":false,"title":"Credit aging bucket creates negative total","query":"Our statement has a negative line. Do you owe us a refund?","evidence":"Invoice and credit detail, available credit and Finance refund policy.","action":"Explain the credit balance and refer any refund request for review.","phrase":"That line is an open credit. I'll confirm its status and what options Finance can review.","pitfall":"Interpret a negative balance as an approved cash refund.","owner":"Accounting"},{"id":"aging-11","module":"aging","critical":false,"title":"Duplicate invoice on the statement","query":"The same order is showing twice. Did you bill us twice?","evidence":"Invoice and work order references, replacement linkage and posting history.","action":"Identify whether there are two valid lines or a duplication and route correction.","phrase":"I'll compare both entries to the underlying order and confirm whether either needs to be corrected.","pitfall":"Collect both rows before checking duplication.","owner":"Accounting"},{"id":"aging-12","module":"aging","critical":false,"title":"Pre-pay requested after payment performance review","query":"Why are you asking us to prepay this new order when we had terms?","evidence":"Approved account decision, active order terms and AR history.","action":"Confirm the policy decision with its owner and communicate the approved ordering options.","phrase":"I'll verify the terms currently approved for your new order and explain the available payment options.","pitfall":"Announce a permanent restriction from an informal discussion.","owner":"Finance"},{"id":"aging-13","module":"aging","critical":true,"title":"Credit limit warning on new work order","query":"The order alert says over limit. Can you release it if I promise a payment?","evidence":"Credit limit, actual exposure, order amount and hold authorization.","action":"Send payment commitment and exposure to the authorized approver.","phrase":"I'll document the payment plan and have the credit team review the order against the approved limit.","pitfall":"Release the work order yourself from a verbal promise.","owner":"Finance"},{"id":"aging-14","module":"aging","critical":false,"title":"Old returned check tied to a duplicate account","query":"We placed a new order under another account. Why is the old check coming up?","evidence":"Verified entity linkage, returned-check history and approval record.","action":"Escalate the duplicate and order decision with evidence of the relationship.","phrase":"I'll have Accounting review the account history and confirm the terms available for the new order.","pitfall":"Treat a new account record as a clean slate automatically.","owner":"Finance"},{"id":"aging-15","module":"aging","critical":false,"title":"Customer requests late-fee reversal","query":"Why is this late fee on the statement, and can you remove it?","evidence":"Approved terms, charge history and authority for any exception.","action":"Route the fee question and follow up on the written decision.","phrase":"I'll review the fee entry against your account terms and ask the authorized team to confirm the outcome.","pitfall":"Waive or promise a fee adjustment yourself.","owner":"Finance"},{"id":"aging-16","module":"aging","critical":false,"title":"Account requests credit limit increase","query":"Our volume grew. Can you raise our credit limit today?","evidence":"Legal entity, current approved limit and credit application process.","action":"Submit a formal review request and communicate the applicable approval process.","phrase":"I can route the request to Finance. They'll confirm what information they need to review a higher limit.","pitfall":"Increase the limit as part of collecting this invoice.","owner":"Finance"},{"id":"aging-17","module":"aging","critical":false,"title":"Returned item still on the aging report","query":"This was picked up last month. Why is it on the overdue statement?","evidence":"Return status, receiving or carrier proof and linked credit.","action":"Hold that item for reconciliation using the applicable workflow and pursue other verified items separately.","phrase":"I'll match the return to the invoice and check whether the credit has posted. I'll update you on that line separately.","pitfall":"Collect the returned line without reviewing the return.","owner":"Sales / QC"},{"id":"aging-18","module":"aging","critical":false,"title":"Outstanding replacement excluded from calling","query":"The replacement is listed, but we already paid for the original.","evidence":"Original payment, replacement order and any authorized extra charges.","action":"Verify linkage and isolate any independently approved residual before requesting payment.","phrase":"I'll check what the original payment covers and whether the replacement has a separate approved charge.","pitfall":"Treat the replacement as a second sale by default.","owner":"Accounting"},{"id":"aging-19","module":"aging","critical":false,"title":"AR item marked not delivered","query":"How can this be due? The part never arrived.","evidence":"Delivery scan, location detail and any verified alternatives.","action":"Put delivery status in review with Dispatch before a routine balance call on that invoice.","phrase":"I'll ask Dispatch to verify the delivery and share the confirmed status before we discuss payment for that item.","pitfall":"Treat invoice generation as delivery proof.","owner":"Dispatch"},{"id":"aging-20","module":"aging","critical":false,"title":"Multiple aging buckets and one promise","query":"We'll pay one lump sum. Can you close the whole past-due list?","evidence":"Invoice-level open amounts, payment commitment and allocation instructions.","action":"Record which items are covered and retain the remaining follow-up by invoice.","phrase":"Could you confirm the total and which invoices it covers? I'll note the remaining items separately so AP can reconcile them.","pitfall":"Close all aging buckets based on a lump-sum promise.","owner":"Collections"},{"id":"delivery-01","module":"delivery","critical":false,"title":"Delivered status but shop denies receipt","query":"Tracking says delivered, but our receiving team has no part.","evidence":"Carrier proof, delivery address and signed recipient detail.","action":"Open a delivery trace and document the dispute before requesting the disputed payment.","phrase":"I'll ask Dispatch to confirm where it was delivered and who received it, then share the verified update.","pitfall":"Assume the counter employee is mistaken because the portal says delivered.","owner":"Dispatch"},{"id":"delivery-02","module":"delivery","critical":false,"title":"Customer requests proof of delivery","query":"Send the POD or AP won't release payment.","evidence":"Correct delivery proof, invoice linkage and authorized AP recipient.","action":"Send the verified POD and obtain a payment review date.","phrase":"I'll match the proof of delivery to this invoice and send it to your verified AP contact. When should I check back?","pitfall":"Send proof from another shipment with a similar reference.","owner":"Dispatch"},{"id":"delivery-03","module":"delivery","critical":false,"title":"Carrier delivered to the wrong branch","query":"It was signed for at our other location. This branch never got it.","evidence":"Destination on order, delivery proof and interbranch transfer evidence.","action":"Route the address discrepancy to Dispatch and clarify the payment path after review.","phrase":"I'll verify the order address and the carrier's delivery record so we can confirm where the part went.","pitfall":"Ask this branch to accept delivery without checking the order destination.","owner":"Dispatch"},{"id":"delivery-04","module":"delivery","critical":false,"title":"Receiver signature unknown","query":"That person doesn't work for us. Who signed?","evidence":"POD name or signature, delivery time and receiving location.","action":"Use Dispatch to trace the signer's role and route evidence to authorized parties.","phrase":"I'll have Dispatch check the delivery time and receiving details and follow up with what they verify.","pitfall":"Share other customers' route records to prove the driver was nearby.","owner":"Dispatch"},{"id":"delivery-05","module":"delivery","critical":false,"title":"GPS stop without signed paperwork","query":"Your truck stopped here. That doesn't prove we got the unit.","evidence":"Route event, driver statement and item-specific delivery proof.","action":"Treat GPS as supporting context and seek item-level proof.","phrase":"The route record shows a stop. I'll check for an item-specific delivery record before we close the trace.","pitfall":"Declare delivery established from GPS alone.","owner":"Dispatch"},{"id":"delivery-06","module":"delivery","critical":false,"title":"Carrier portal shows attempted delivery","query":"The carrier says delivery attempted. Are we supposed to pay already?","evidence":"Carrier attempt event, reschedule status and order terms.","action":"Request the retry plan and apply the verified payment timing.","phrase":"I'll check the carrier's next attempt and confirm the payment timing under your order terms.","pitfall":"Mark the item received from an attempted delivery scan.","owner":"Dispatch"},{"id":"delivery-07","module":"delivery","critical":false,"title":"Refused damaged shipment at the door","query":"We refused it because the pallet was damaged.","evidence":"Proof of refusal, photos and carrier return disposition.","action":"Route the damaged refusal to Dispatch and QC with no premature settlement promise.","phrase":"I'll ask Dispatch to confirm the refusal and have QC review the damage record and next steps.","pitfall":"Treat refusal as completed return credit.","owner":"Sales / QC"},{"id":"delivery-08","module":"delivery","critical":false,"title":"Driver noted refusal as changed mind","query":"We asked the driver to wait while we inspected it. We didn't cancel the order.","evidence":"Driver notes, customer timeline and available contemporaneous evidence.","action":"Log both accounts and send the conflict for review.","phrase":"I have your timeline. I'll compare it with the driver record and ask the team to confirm what happened before quoting any adjustment.","pitfall":"Present one side's account as a verified fact.","owner":"Dispatch"},{"id":"delivery-09","module":"delivery","critical":false,"title":"Delivery address changed after shipment","query":"I emailed a new address after it shipped. Can you reroute today?","evidence":"Original order address, timestamp of change and carrier intercept status.","action":"Request a carrier decision through Dispatch and confirm only approved changes.","phrase":"I'll check whether the carrier can still redirect it and follow up once Dispatch confirms the options.","pitfall":"Guarantee the redirect from the customer's email alone.","owner":"Dispatch"},{"id":"delivery-10","module":"delivery","critical":false,"title":"Broker shipped directly to customer","query":"We don't see a Benzeen truck on the paperwork. Who delivered it?","evidence":"Vendor shipment, carrier tracking and order linkage.","action":"Request broker or vendor POD through Fulfillment and link it to the customer invoice.","phrase":"This order may have shipped directly from the supplier. I'll trace the carrier paperwork for your invoice.","pitfall":"Close the trace because no local delivery record exists.","owner":"Fulfillment"},{"id":"delivery-11","module":"delivery","critical":false,"title":"Part status shows packaging","query":"It's still being packed. Why does the invoice look ready to collect?","evidence":"Order location status, shipment release and approved terms.","action":"Verify the actual fulfillment milestone and follow the approved billing trigger.","phrase":"I'll check whether the part has moved from packaging to shipment and confirm which payment terms apply.","pitfall":"Interpret packaging as completed delivery.","owner":"Fulfillment"},{"id":"delivery-12","module":"delivery","critical":false,"title":"Two orders delivered separately with extra freight","query":"You split the deliveries. We never agreed to pay freight twice.","evidence":"Both order quotes, delivery routes and approved freight adjustment.","action":"Bring the split-delivery evidence to Sales or QC and resolve the authorized freight amount.","phrase":"I'll compare both delivery records and freight lines with what Sales agreed to, then confirm the correct amount.","pitfall":"Charge both fees without reviewing the split-delivery exception.","owner":"Sales"},{"id":"delivery-13","module":"delivery","critical":false,"title":"Order sent with only one pallet received","query":"We signed for one pallet and there were supposed to be two.","evidence":"Bill of lading, package counts and individual tracking events.","action":"Trace the missing pallet and identify the affected lines.","phrase":"I'll compare the delivery count with the bill of lading and ask the carrier to trace the second pallet.","pitfall":"Treat a signature for one pallet as confirmation of the complete order.","owner":"Dispatch"},{"id":"delivery-14","module":"delivery","critical":false,"title":"Service desk accepted delivery after hours","query":"It was left after closing. Nobody in our parts department saw it.","evidence":"Delivery time, approved drop instruction and evidence of handoff.","action":"Check whether an after-hours release was authorized and document the trace.","phrase":"I'll check whether there was an approved after-hours drop and where the carrier recorded leaving it.","pitfall":"Disclose full route details to the front desk to identify the package.","owner":"Dispatch"},{"id":"delivery-15","module":"delivery","critical":false,"title":"Customer plans pickup at a different yard","query":"Can I pick up at the north yard instead of the yard on the order?","evidence":"Actual part location, transfer status and release authorization.","action":"Confirm inventory routing and release instructions before scheduling pickup.","phrase":"I'll check which yard has the part and whether a transfer can be arranged before you make the trip.","pitfall":"Direct them to the other yard before confirming it has the unit.","owner":"Fulfillment"},{"id":"delivery-16","module":"delivery","critical":false,"title":"Installer received part on behalf of buyer","query":"It went to my installer. Do you have their receipt?","evidence":"Authorized ship-to record and installer delivery proof.","action":"Verify the buyer's designated recipient and send scoped delivery confirmation.","phrase":"I'll match the installer receipt to your approved ship-to instructions and send the confirmation through our verified channel.","pitfall":"Change the billed account to the installer.","owner":"Dispatch"},{"id":"delivery-17","module":"delivery","critical":false,"title":"Proof requested for a concealed-damage claim","query":"The pallet looked fine outside. We found the damage once we opened it.","evidence":"Delivery time, packaging photos and damage photos or report.","action":"Route time-sensitive carrier and QC evidence through the approved process.","phrase":"Please keep the packaging and share photos through the approved channel. I'll ask QC and Dispatch what they need to review it.","pitfall":"Promise reimbursement or assign liability before review.","owner":"Sales / QC"},{"id":"delivery-18","module":"delivery","critical":false,"title":"Part missing from delivered box","query":"The label shows delivered, but the box didn't contain the item we ordered.","evidence":"Package photos, packing list, shipment weight and fulfillment check.","action":"Open a contents trace and avoid treating outer-box delivery as proof of the correct item.","phrase":"I'll compare the packing record and package details with what you received and open a trace for the missing item.","pitfall":"Assume the correct part arrived because a box was signed for.","owner":"Fulfillment"},{"id":"delivery-19","module":"delivery","critical":false,"title":"Driver brought back an undelivered order","query":"The driver came while we were closed and took the item back.","evidence":"Route return log, current stock location and redelivery approval.","action":"Confirm whether it was returned to the yard and ask about a new delivery plan.","phrase":"I'll confirm the item is back at the yard and check what Dispatch can schedule for another delivery attempt.","pitfall":"Tell the customer the item remains delivered in the ledger.","owner":"Dispatch"},{"id":"delivery-20","module":"delivery","critical":false,"title":"Freight tracking number changed in transit","query":"The tracking number you sent stopped updating. Was it transferred?","evidence":"Original and successor carrier references, transfer scan and delivery status.","action":"Obtain the successor tracking number and send a verified status update.","phrase":"I'll check whether the load transferred to another carrier and send the current tracking reference once it's verified.","pitfall":"Conclude the shipment was lost solely from a stale tracking link.","owner":"Dispatch"},{"id":"returns-01","module":"returns","critical":false,"title":"Wrong part delivered and ready to return","query":"We got the wrong part. It's boxed and ready for pickup.","evidence":"Ordered line, actual tag or part details and return authorization.","action":"Route the mismatch to Sales or QC and send confirmed pickup instructions.","phrase":"I'll document the part mismatch and ask the return team to confirm the pickup plan.","pitfall":"Promise a credit before the order and return are verified.","owner":"Sales / QC"},{"id":"returns-02","module":"returns","critical":false,"title":"Wrong safety-related item sent","query":"We ordered a lamp and received a seatbelt. Can we install it anyway?","evidence":"Ordered item, received tag and approved fitment or return instructions.","action":"Ask them to set it aside and have the appropriate team verify the replacement and return.","phrase":"Please set the item aside. I'll have Sales and QC verify what shipped and coordinate the correct replacement or return.","pitfall":"Give installation advice on an unverified item.","owner":"Sales / QC"},{"id":"returns-03","module":"returns","critical":false,"title":"Returned part still in vehicle","query":"The carrier came while the unit was still installed.","evidence":"Failed attempt and actual removal or packaging readiness.","action":"Set a realistic pickup after the customer confirms the unit is out and ready.","phrase":"When the unit is removed and ready for pickup, please let me know so Dispatch can review the next available date.","pitfall":"Schedule a repeat attempt without confirming readiness.","owner":"Dispatch"},{"id":"returns-04","module":"returns","critical":false,"title":"Shop cannot locate the part","query":"We opened a return, but our shop can't find the unit.","evidence":"Return ticket, last known location and ownership of the search.","action":"Document the missing item and agree on a specific check-in before pickup.","phrase":"I'll note that it's being located. What day can we check back to see whether it is ready for pickup?","pitfall":"Tell Dispatch the unit is ready despite the shop's statement.","owner":"Collections"},{"id":"returns-05","module":"returns","critical":false,"title":"Yard drop-off without receiver scan","query":"We dropped it at the yard the day we picked up the replacement.","evidence":"Drop time, yard, part tag or receipt and Receiving records.","action":"Open a receiving trace and update the DT status after confirmation.","phrase":"Could you share the yard, date and any drop-off receipt? I'll ask Receiving to match the unit to the return.","pitfall":"Promote the DT based only on the customer's recollection.","owner":"Fulfillment"},{"id":"returns-06","module":"returns","critical":false,"title":"DT ready for pickup but no movement","query":"The return ticket says ready. Why is the part still here?","evidence":"DT readiness, Dispatch queue and approved pickup method.","action":"Ask Dispatch for a real scheduled window and relay the confirmed update.","phrase":"I can see the return is marked ready. I'll check Dispatch's schedule and confirm the pickup window once it's assigned.","pitfall":"Describe a ready status as a scheduled or completed pickup.","owner":"Dispatch"},{"id":"returns-07","module":"returns","critical":false,"title":"Pickup completed but DT still open","query":"Your driver already picked it up. Why does the ticket show open?","evidence":"Pickup evidence, intake scan and DT promotion status.","action":"Confirm receipt and ask the authorized team to promote the linked return record.","phrase":"I'll confirm what Receiving has and ask the return owner to update the ticket once the intake is verified.","pitfall":"Assume an open DT means the pickup never happened.","owner":"Fulfillment"},{"id":"returns-08","module":"returns","critical":false,"title":"Vendor pickup awaiting credit invoice","query":"The vendor picked up the unit. Why haven't you issued our credit?","evidence":"Vendor receipt, vendor credit and customer return status.","action":"Track the supplier and customer workflows with the appropriate owners.","phrase":"I'll verify the vendor pickup and check where the customer credit is in our review process.","pitfall":"Promise the vendor's credit is already on the customer's account.","owner":"Fulfillment"},{"id":"returns-09","module":"returns","critical":false,"title":"Return label issued but never scanned","query":"I printed the label. Can you issue my credit now?","evidence":"Carrier acceptance event, label status and return terms.","action":"Check carrier handoff and offer authorized drop-off or pickup help.","phrase":"The label was issued. Once the carrier records acceptance, we can trace the return and confirm the next step.","pitfall":"Treat label creation as proof the carrier has the part.","owner":"Dispatch"},{"id":"returns-10","module":"returns","critical":false,"title":"Pickup ticket voided after missed handoff","query":"My old ticket is void. Can I still send the part?","evidence":"Voided DT, eligibility and approved new routing.","action":"Ask the return owner whether to reopen or issue a new authorization before shipment.","phrase":"I'll check whether we can reopen the return and send you current instructions before you ship it.","pitfall":"Tell the customer to reuse an inactive label.","owner":"Sales / QC"},{"id":"returns-11","module":"returns","critical":false,"title":"Return requested after usual window","query":"The repair was delayed. Can I send the part back now?","evidence":"Delivery date, order-specific terms and authorized exception channel.","action":"Verify the applicable return terms and submit a documented exception request if appropriate.","phrase":"I'll check the delivery date and return terms, then ask the team to review the circumstances you described.","pitfall":"Approve or deny solely from memory of a standard deadline.","owner":"Sales / QC"},{"id":"returns-12","module":"returns","critical":false,"title":"Customer's end buyer canceled","query":"Our customer never picked up the part, so we want to return it.","evidence":"Original buyer, reason and actual delivery date.","action":"Review the order's return eligibility and explain documented next steps.","phrase":"I'll verify when your shop received the part and have the return team confirm the available options.","pitfall":"Assume the end buyer's cancellation automatically voids our invoice.","owner":"Sales / QC"},{"id":"returns-13","module":"returns","critical":false,"title":"Vehicle totaled and part no longer needed","query":"The vehicle was totaled before we could use the part. Do we get a credit?","evidence":"Order history, return timing and condition requirements.","action":"Route the changed-need return to Sales or QC under the approved terms.","phrase":"I'll document the reason and check what options are available for the part under your order terms.","pitfall":"Promise a full credit because the vehicle was totaled.","owner":"Sales / QC"},{"id":"returns-14","module":"returns","critical":false,"title":"Warranty claim without diagnostic report","query":"The engine failed. My installer said a report is unnecessary.","evidence":"Invoice, installer documentation and warranty intake requirements.","action":"Request the case-specific records through Warranty and document the symptoms separately.","phrase":"I'll route this to Warranty. Could your installer share the diagnostic report and any recorded codes through our approved intake channel?","pitfall":"Approve a warranty claim from a verbal diagnosis alone.","owner":"Warranty / QC"},{"id":"returns-15","module":"returns","critical":false,"title":"Customer says installer followed required steps","query":"We already changed the fluids and seals. Do you still need receipts?","evidence":"Warranty requirements for the order, installation records and receipts.","action":"Request the evidence Warranty confirms is needed and track the handoff.","phrase":"I'll check what Warranty needs for this order. Installation records and parts or service receipts can help document the work.","pitfall":"Invent a warranty requirement or guarantee acceptance.","owner":"Warranty / QC"},{"id":"returns-16","module":"returns","critical":false,"title":"Warranty labor asked for before installation","query":"We didn't install the unit, but we want the full labor allowance.","evidence":"Installation record, labor claimed and applicable authorization.","action":"Ask Warranty to review what work occurred and give a documented decision.","phrase":"I'll ask Warranty to review the work performed and confirm what the coverage allows for this order.","pitfall":"Merge the labor request into a goods refund automatically.","owner":"Warranty / QC"},{"id":"returns-17","module":"returns","critical":false,"title":"Part fails customer insurance quality standard","query":"The insurer wouldn't accept the condition. We returned it immediately.","evidence":"Photos, agreed grade, refusal or return evidence and QC decision.","action":"Refer the grade dispute to QC and match the return before discussing credit.","phrase":"I'll share the condition evidence with QC and verify the return record, then update you on the credit review.","pitfall":"Concede the grade dispute without checking sales terms or evidence.","owner":"Warranty / QC"},{"id":"returns-18","module":"returns","critical":false,"title":"Incomplete component at delivery","query":"The fender arrived without the pieces we expected.","evidence":"Listing, included components, photos and order notes.","action":"Have Sales or QC verify the sold configuration and resolve the missing component.","phrase":"Could you send a photo of what arrived? I'll compare it to what the order included and follow up on the options.","pitfall":"Promise accessories that were never included without reviewing the order.","owner":"Sales / QC"},{"id":"returns-19","module":"returns","critical":false,"title":"Customer wants repair instead of return","query":"Keep the return closed. I'd rather repair the part with an allowance.","evidence":"Repair estimate, evidence and written agreement from the approval owner.","action":"Keep the allowance pending and get documented approval before changing the return path.","phrase":"I'll share the proposed repair with QC and confirm whether the alternate resolution is approved.","pitfall":"Tell the customer to start billable work on an unapproved allowance.","owner":"Warranty / QC"},{"id":"returns-20","module":"returns","critical":false,"title":"Replacement delivered while original return remains open","query":"The replacement arrived. Why are you still asking for the first unit?","evidence":"Original and replacement references, return terms and pickup status.","action":"Explain the linked return, verify readiness and schedule the approved next step.","phrase":"The replacement is linked to the original unit. I'll check the return instructions and help confirm pickup for that unit.","pitfall":"Close the original return because the replacement was delivered.","owner":"Fulfillment"},{"id":"handoff-01","module":"handoff","critical":false,"title":"Sales deposit appears smaller than the quote","query":"Did Sales offer a discount, or do I need to pay this difference?","evidence":"Quote, deposit and any approved pricing exception.","action":"Ask Sales for the written pricing decision and reconcile the deposit with Accounting.","phrase":"I'll compare your deposit to the agreed quote and confirm with Sales whether the difference was an approved adjustment.","pitfall":"Treat every deposit difference as overdue AR.","owner":"Sales"},{"id":"handoff-02","module":"handoff","critical":false,"title":"Replacement carries an unapproved price increase","query":"The original part cost less. Why did the replacement invoice go up?","evidence":"Both invoices and approved replacement pricing or uplift.","action":"Ask Sales to explain the price difference and Accounting to reconcile it once approved.","phrase":"I'll compare both invoices and confirm whether the replacement had an approved price change.","pitfall":"Assume the higher replacement price is collectible.","owner":"Sales"},{"id":"handoff-03","module":"handoff","critical":false,"title":"Replacement freight added in error","query":"The notes said to use store credit, but this replacement includes freight.","evidence":"Original order, replacement freight line and written authorization.","action":"Refer the freight line to Sales or QC and preserve the posted credit status.","phrase":"I'll check whether the replacement was supposed to carry freight and follow up once the team verifies it.","pitfall":"Apply additional store credit to hide the questioned charge.","owner":"Sales / QC"},{"id":"handoff-04","module":"handoff","critical":false,"title":"Sales promised item-level credit by phone","query":"Sales said they'd credit the seat component. Did anyone enter it?","evidence":"Order line, recorded customer request and formal approval.","action":"File the handoff with the exact line and requested action in the Sales-to-AR queue.","phrase":"I'll ask Sales and QC to confirm the credit for that specific line and check whether Accounting posted it.","pitfall":"Record a generic complaint with no invoice or line detail.","owner":"Sales / QC"},{"id":"handoff-05","module":"handoff","critical":false,"title":"Vendor return still sitting in the yard","query":"The PO notes say returned, but the vendor is calling for payment.","evidence":"Yard location, actual carrier movement and PO notes.","action":"Have Fulfillment confirm current custody before AP discusses vendor credit.","phrase":"I'll verify whether the unit is still in our yard or has reached the vendor. We'll follow up with confirmed status.","pitfall":"Treat the PO note as proof of vendor receipt.","owner":"Fulfillment"},{"id":"handoff-06","module":"handoff","critical":false,"title":"Vendor says only one of two units came back","query":"You sent one unit back. Where is the other?","evidence":"Return order, line counts, shipment records and vendor receiving proof.","action":"Reconcile each returned unit before disputing the vendor's remaining charge.","phrase":"I'll trace both return lines and share the verified movement for each item.","pitfall":"Dispute both charges without line-level support.","owner":"Fulfillment"},{"id":"handoff-07","module":"handoff","critical":false,"title":"Closed vendor PO and partial supplier credit","query":"The closed PO says full credit, but your vendor posted less.","evidence":"Original vendor invoice, actual credit memo and freight or fee breakdown.","action":"Ask AP and Fulfillment to reconcile the difference against approved terms.","phrase":"I'll compare the posted supplier credit with the original PO and confirm what's still under review.","pitfall":"Treat a closed PO as proof the full credit was received.","owner":"Finance"},{"id":"handoff-08","module":"handoff","critical":false,"title":"Need vendor return date for credit trace","query":"We can't issue the supplier credit without a date or tracking number.","evidence":"Vendor return tracking, delivered event and approved proof.","action":"Collect item-specific return proof from Fulfillment so AP can request the memo.","phrase":"I'll request the return date and tracking record so the vendor can trace receipt and review the credit.","pitfall":"Send a customer delivery tracking number as vendor return proof.","owner":"Fulfillment"},{"id":"handoff-09","module":"handoff","critical":false,"title":"Replacement required return invoice on original","query":"You charged the original card, then sent a replacement. Where is the return document?","evidence":"Original payment, linked replacement and verified return authorization.","action":"Give Accounting the original invoice and DT linkage to produce the approved return document.","phrase":"I'll match the payment and replacement to the original invoice, then check the status of the return invoice.","pitfall":"Create a new sale credit on the replacement without checking linkage.","owner":"Accounting"},{"id":"handoff-10","module":"handoff","critical":false,"title":"WO generated but no invoice to request","query":"AP can't find the invoice. We only have a work order number.","evidence":"Work order status, invoice generation and fulfilled line evidence.","action":"Use Powerlink to locate the valid invoice or ask the authorized owner to verify the order stage.","phrase":"I found the work order. I'll confirm whether it has been invoiced and share the correct billing document when available.","pitfall":"Send the work order as a payment invoice.","owner":"Sales"},{"id":"handoff-11","module":"handoff","critical":false,"title":"Quotation confused with invoice","query":"I have a quote reference. Is that the bill I need to pay?","evidence":"Quote, work order and invoice linkage for the actual order.","action":"Find the issued invoice and send it to the verified payer.","phrase":"I'll use the quote to locate the issued invoice, then send the correct copy to your AP contact.","pitfall":"Ask AP to pay the quote as though it were an invoice.","owner":"Collections"},{"id":"handoff-12","module":"handoff","critical":false,"title":"DT search using wrong identifier","query":"I have a return ticket, but your agent keeps asking for an invoice number.","evidence":"Record type, DT number and linked original invoice.","action":"Search the correct return record and then verify its linked invoice.","phrase":"The return ticket is enough to start the lookup. I'll match it to the invoice so we can review the status.","pitfall":"Search for the return ticket only in invoice fields.","owner":"Fulfillment"},{"id":"handoff-13","module":"handoff","critical":false,"title":"Inquiry stalled between departments","query":"Sales says call Dispatch. Dispatch says ask Accounting. Who owns this?","evidence":"Item movement, pricing decision and posting action outstanding.","action":"Assign a single coordinating owner and route each request with evidence and a dated follow-up.","phrase":"I'll coordinate the open items and give you one update once the responsible teams confirm their parts.","pitfall":"Send the customer back through the same handoff loop.","owner":"Collections Lead"},{"id":"handoff-14","module":"handoff","critical":false,"title":"Payment applied to a different invoice","query":"The payment is there, but you applied it to the wrong bill.","evidence":"Payment reference, remittance instructions and current application.","action":"Ask Accounting to review the posting against the payer's instructions.","phrase":"I'll compare your remittance to the posting and ask Accounting to review the invoice application.","pitfall":"Move the posting manually without authorization.","owner":"Accounting"},{"id":"handoff-15","module":"handoff","critical":false,"title":"Two departments report different resolutions","query":"Your sales email says handled, but AP shows the deduction still open.","evidence":"Written approval, posted transaction and current owner status.","action":"Reconcile the approved action with the actual posting and update both teams.","phrase":"I'll verify what was approved and whether it has posted, then send one update with the confirmed status.","pitfall":"Mark the issue resolved because one department replied.","owner":"Accounting"},{"id":"handoff-16","module":"handoff","critical":false,"title":"Order held pending QC approval","query":"The order is ready. Why is it still waiting for release?","evidence":"QC decision, work order hold and payment prerequisites.","action":"Send the release request to the authorized owner with remaining conditions.","phrase":"I'll confirm what remains open with QC and update you once the order is cleared for the next step.","pitfall":"Bypass the QC hold to save time.","owner":"Sales / QC"},{"id":"handoff-17","module":"handoff","critical":false,"title":"New order changed from charge to prepaid","query":"Sales said on account, but Dispatch needs payment first.","evidence":"Approved account terms and latest order-specific authorization.","action":"Confirm the decision with Sales and Finance before collection or release.","phrase":"I'll verify the payment terms currently recorded for this order and tell you which option is authorized.","pitfall":"Assume the driver's message overrides account approval.","owner":"Finance"},{"id":"handoff-18","module":"handoff","critical":false,"title":"Billed to an employee's former company","query":"I ordered it for my new employer. It went to my former shop's account.","evidence":"Actual ordering authority, account history and invoice recipient.","action":"Escalate the misbilling and verify legal responsibility before sharing information or rebilling.","phrase":"I'll route the account mismatch for review and verify who is authorized to receive the billing details.","pitfall":"Move the invoice to the new company based on a phone request.","owner":"Finance"},{"id":"handoff-19","module":"handoff","critical":true,"title":"Cardholder reports unauthorized transaction","query":"I don't recognize that charge. Can you tell me who placed the order?","evidence":"Verified complainant, transaction record and disputes intake requirements.","action":"Log the allegation and route through the approved dispute team without exposing another party's information.","phrase":"I'll record what you reported and have our disputes team review the transaction through the verified channel.","pitfall":"Share the buyer's complete order or card information on the call.","owner":"Chargebacks"},{"id":"handoff-20","module":"handoff","critical":false,"title":"Sales asks agent to close query after verbal agreement","query":"Sales said the shop agreed. Can I mark the AR row resolved?","evidence":"Promised action, assigned owner and verified completion evidence.","action":"Set the status to the actual stage until the promised payment, credit or other action is verified.","phrase":"I'll note the agreement and keep the follow-up open until we can verify the action was completed.","pitfall":"Close because one person says a future action is planned.","owner":"Collections Lead"}]};</script>
<script>(function academyApp() {
  "use strict";

  const { modules, scenarios, exams, sources } = ACADEMY;
  const moduleById = new Map(modules.map(m => [m.id, m]));
  const scenarioById = new Map(scenarios.map(s => [s.id, s]));
  const examById = new Map(exams.map(e => [e.id, e]));
  const learningOrder = ["calls", "cod", "remittance", "credits", "corporate", "aging", "refunds", "delivery", "returns", "handoff"];
  const navItems = [
    ["dashboard", "Overview", "▦"], ["learn", "Learning path", "≡"],
    ["practice", "Scenario library", "◈"], ["exams", "Mock tests", "✓"],
    ["guide", "Field guide", "◇"]
  ];
  const main = document.getElementById("main");
  const menu = document.getElementById("menu");
  const sidebar = document.getElementById("sidebar");
  const storageKey = "benzeen-collections-academy-v1";
  const pageSize = 12;
  const followUps = {
    cod: ["I need to close out today's parts orders. Can you give me an answer now?", "State the last verified payment status. Give a specific time to confirm what reached the ledger or what remains due."],
    remittance: ["Our AP system only has the lump-sum amount. Can you just apply it somewhere?", "Ask for the invoice and dollar allocations. Explain how Accounting will handle the payment while the allocation is under review."],
    credits: ["The old credit memo is right in front of me. Why can't you apply it right now?", "Explain the difference between the original memo and the available balance. Say what will determine whether it can be applied."],
    refunds: ["The owner is busy. Please use the new details I gave you so I can close this out.", "Acknowledge the time pressure, keep the verified refund path and explain who will confirm the next step."],
    calls: ["I don't handle AP and don't know when they will call you back.", "Ask for the verified contact or a realistic callback window. Keep account information limited."],
    corporate: ["Corporate says talk to the location. The location says talk to corporate.", "Confirm the legal payer, the branch identifier and one person or queue that owns the next action."],
    aging: ["If one invoice is under review, do we have to send anything this week?", "Separate the verified, undisputed items and ask which ones AP can include and on what date."],
    delivery: ["The software says delivered. I need to know who actually got it.", "State which delivery evidence is available, what Dispatch is tracing and when you will report back."],
    returns: ["Your driver took it already. Why does it matter what the ticket says?", "Explain that pickup, receiving and posted credits are separate. Ask for the detail that helps trace custody."],
    handoff: ["Two different teams already asked me for this. Who is going to get back to me?", "Repeat the specific issue, name the coordinating owner and offer a dated update through the verified channel."]
  };
  let durable = true;
  let state = { complete: [], attempts: [], last: null, running: null };
  let filters = { term: "", module: "", status: "", page: 1 };

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
    if (saved && Array.isArray(saved.complete) && Array.isArray(saved.attempts)) {
      state = { ...state, ...saved };
    }
  } catch {
    durable = false;
  }
  state.complete = [...new Set(state.complete)].filter(id => scenarioById.has(id));
  const completed = new Set(state.complete);

  function save() {
    state.complete = [...completed];
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
    } catch {
      durable = false;
    }
    if (!durable) document.querySelector(".side-foot").textContent = "Progress retained for this session";
  }

  const esc = value => String(value ?? "").replace(/[&<>"']/g, character =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[character]);
  const htmlLink = (hash, label, cls = "btn") => `<a class="${cls}" href="#${hash}">${esc(label)}</a>`;
  const tag = (label, cls = "") => `<span class="tag ${cls}">${esc(label)}</span>`;
  const quote = text => `<blockquote class="case-quote">“${esc(text)}”</blockquote>`;
  const percentage = (number, total) => total ? Math.round(number / total * 100) : 0;
  const title = (heading, copy, overline = "") => `<header class="section-title">${overline ? `<p class="eyebrow">${esc(overline)}</p>` : ""}<h1>${esc(heading)}</h1><p class="sub">${esc(copy)}</p></header>`;

  function setMenu(open) {
    sidebar.classList.toggle("open", open);
    menu.setAttribute("aria-expanded", String(open));
  }

  function moduleCases(id) {
    return scenarios.filter(s => s.module === id);
  }

  function moduleProgress(id) {
    return moduleCases(id).filter(s => completed.has(s.id)).length;
  }

  function chartRow(module) {
    const total = moduleCases(module.id).length;
    const count = moduleProgress(module.id);
    return `<div class="chart-row">
      <a class="chart-label" href="#lesson/${module.id}">${esc(module.title)}</a>
      <div class="track" role="progressbar" aria-label="${esc(module.title)}" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${count}"><span style="--fill:${percentage(count,total)}%;--accent:${module.color}"></span></div>
      <span class="chart-val">${count} / ${total}</span></div>`;
  }

  function attemptsList(attempts) {
    if (!attempts.length) return `<p class="sub">Your scores and critical misses will appear here after you submit a mock test.</p>${htmlLink("exams","Browse mock tests")}`;
    return `<ul class="row-list">${attempts.map(attempt =>
      `<li><a href="#review/${attempt.id}">${esc(examById.get(attempt.exam)?.title || "Mock test")}</a>
      <div class="small">${attempt.score}% · ${attempt.criticalMisses} critical misses · ${esc(dateLabel(attempt.date))}</div></li>`
    ).join("")}</ul>`;
  }

  function dashboard() {
    const recent = state.last && scenarioById.get(state.last);
    const next = recent && !completed.has(recent.id) ? recent :
      learningOrder.flatMap(moduleCases).find(s => !completed.has(s.id));
    const validAttempts = state.attempts.filter(a => typeof a.score === "number");
    const best = validAttempts.length ? Math.max(...validAttempts.map(a => a.score)) + "%" : "—";
    return `<section class="hero" aria-labelledby="overview-title">
      <div><p class="eyebrow">Agent training</p><h1 id="overview-title">Collections Academy</h1>
      <p class="sub">Practice Benzeen’s real collections workflows through fictionalized customer calls. Learn what to verify, what to say and who owns the next step.</p>
      <div class="actions">${htmlLink(next ? "case/" + next.id : "practice", next ? (recent ? "Continue practice" : "Start first scenario") : "Review scenarios","btn primary")}
      ${htmlLink("learn","View learning path","btn secondary")}</div></div>
      <div class="hero-stat"><div><strong>200</strong><span>Distinct customer and internal scenarios</span></div><div><strong>10</strong><span>Workflow lessons</span></div><div><strong>3</strong><span>Scored mock tests</span></div></div>
      </section>
      <section class="grid kpis" aria-label="Training progress">
      <div class="panel kpi"><span class="small">Scenarios mastered</span><strong>${completed.size} / ${scenarios.length}</strong><span class="small">Correct decision in practice</span></div>
      <div class="panel kpi"><span class="small">Curriculum progress</span><strong>${percentage(completed.size,scenarios.length)}%</strong><span class="small">Across all 10 modules</span></div>
      <div class="panel kpi"><span class="small">Best test score</span><strong>${best}</strong><span class="small">${validAttempts.length} recorded attempts</span></div>
      </section>
      <div class="grid split"><section class="panel"><div class="section-head"><h2>Progress by module</h2></div>
      <div class="chart">${learningOrder.map(id => chartRow(moduleById.get(id))).join("")}</div></section>
      <div class="grid"><section class="panel"><h2>Continue learning</h2>
      ${next ? `<p><strong>${esc(next.title)}</strong></p><p class="sub">${esc(moduleById.get(next.module).summary)}</p>${htmlLink("case/"+next.id,"Open scenario","btn primary")}` : `<p>All 200 practice decisions are complete.</p>${htmlLink("exams","Take a mock test","btn primary")}`}</section>
      <section class="panel"><h2>Recent mock tests</h2>${attemptsList(validAttempts.slice(0,3))}</section></div></div>`;
  }

  function learn() {
    return title("Learning path","Work through the foundations, transaction basics, account ownership and exceptions. Each lesson leads to 20 practice calls.") +
      `<div class="grid cards">${learningOrder.map((id, index) => {
        const module = moduleById.get(id);
        return `<article class="card"><div class="module-symbol" aria-hidden="true" style="--accent:${module.color}">${module.icon}</div>
        <div class="meta">${tag(module.stage)}${tag(moduleProgress(id) + " / 20 mastered","good")}</div>
        <h3 style="margin-top:.7rem">${esc(module.title)}</h3><p>${esc(module.summary)}</p>
        <div class="actions">${htmlLink("lesson/"+id, index === 0 ? "Start lesson" : "Open lesson")}</div></article>`;
      }).join("")}</div>`;
  }

  function lesson(id) {
    const module = moduleById.get(id);
    if (!module) return missing();
    const next = moduleCases(id).find(s => !completed.has(s.id));
    return title(module.title,module.summary,module.stage) + `
      <div class="grid split">
      <section class="panel"><h2>How the workflow works</h2><p>${esc(module.concept)}</p>
      <h3>Before you act</h3><ol>${module.checks.map(check => `<li>${esc(check)}</li>`).join("")}</ol>
      <div class="actions">${htmlLink("case/" + (next?.id || moduleCases(id)[0].id), next ? "Practice next scenario" : "Review first scenario","btn primary")}
      ${htmlLink("practice/"+id,"Browse all 20 cases")}</div></section>
      <section class="panel"><h2>Lesson progress</h2><div class="chart">${chartRow(module)}</div>
      <details><summary>Workflows used in this lesson</summary><ul>${module.sources.map(key => `<li>${esc(sources[key].title)} · ${esc(sources[key].tabs)}</li>`).join("")}</ul></details></section></div>
      <section class="section panel"><h2>Scenario checklist</h2>
      <ul class="row-list">${moduleCases(id).map(s => `<li><a href="#case/${s.id}">${esc(s.title)}</a> ${completed.has(s.id) ? tag("Mastered","good") : ""}</li>`).join("")}</ul></section>`;
  }

  function practice(routeModule) {
    if (moduleById.has(routeModule)) filters = { ...filters, module: routeModule, page: 1 };
    return title("Scenario library","Search all 200 customer and internal queries. Filter by workflow or revisit decisions you want to master.") +
      `<section class="panel"><div class="filterbar">
      <label>Search scenarios<input id="search" type="search" placeholder="Try remittance, core or yard pickup" value="${esc(filters.term)}"></label>
      <label>Module<select id="module-filter"><option value="">All modules</option>${learningOrder.map(id => `<option value="${id}"${filters.module === id ? " selected" : ""}>${esc(moduleById.get(id).title)}</option>`).join("")}</select></label>
      <label>Practice status<select id="status-filter"><option value="">All cases</option><option value="unseen"${filters.status === "unseen" ? " selected" : ""}>To master</option><option value="complete"${filters.status === "complete" ? " selected" : ""}>Mastered</option><option value="critical"${filters.status === "critical" ? " selected" : ""}>Critical decisions</option></select></label>
      </div><div id="results"></div></section>`;
  }

  function results() {
    const list = document.getElementById("results");
    if (!list) return;
    const terms = filters.term.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const found = scenarios.filter(s => {
      const searchable = [s.title,s.query,s.evidence,s.action,s.owner,moduleById.get(s.module).title].join(" ").toLowerCase();
      return (!filters.module || s.module === filters.module) &&
        (filters.status !== "complete" || completed.has(s.id)) &&
        (filters.status !== "unseen" || !completed.has(s.id)) &&
        (filters.status !== "critical" || s.critical) &&
        terms.every(term => searchable.includes(term));
    });
    const pages = Math.max(1,Math.ceil(found.length / pageSize));
    filters.page = Math.min(Math.max(filters.page,1),pages);
    const start = (filters.page - 1) * pageSize;
    list.innerHTML = `<p class="results-summary" id="result-count" role="status" tabindex="-1">${found.length ? `Showing ${start+1}–${Math.min(start+pageSize,found.length)} of ${found.length} scenarios` : "No scenarios match these filters."}</p>
      ${found.length ? `<div class="grid cards">${found.slice(start,start+pageSize).map(s =>
        `<article class="card case-card"><div class="meta">${tag(moduleById.get(s.module).title)}${s.critical ? tag("Critical","critical") : ""}${completed.has(s.id) ? tag("Mastered","good") : ""}</div>
        <h3><a href="#case/${s.id}">${esc(s.title)}</a></h3><p>${esc(s.query)}</p></article>`).join("")}</div>` : `<button type="button" class="btn" data-action="clear-filters">Clear filters</button>`}
      ${pages > 1 ? `<div class="pagers" aria-label="Pagination">
      <button class="btn" data-action="previous" ${filters.page === 1 ? "disabled" : ""}>Previous</button><span>Page ${filters.page} of ${pages}</span>
      <button class="btn" data-action="next" ${filters.page === pages ? "disabled" : ""}>Next</button></div>` : ""}`;
  }

  function shuffle(values) {
    const array = [...values];
    for (let index = array.length - 1; index > 0; index--) {
      const next = Math.floor(Math.random() * (index + 1));
      [array[index],array[next]] = [array[next],array[index]];
    }
    return array;
  }

  function questionChoices(s, order, picked = "") {
    const wording = { correct:s.action, unsafe:s.pitfall, deferred:"Record the customer's account of the issue and wait for another contact before starting the verification." };
    return order.map(option => `<label class="choice"><input type="radio" name="decision" value="${option}"${picked === option ? " checked" : ""} required><span>${esc(wording[option])}</span></label>`).join("");
  }

  function modelAnswer(s, tagName = "details") {
    const lead = tagName === "details" ? "<summary>Model answer and call script</summary>" : "<h3>Model answer and call script</h3>";
    return `<${tagName}>${lead}
      <p><strong>Training point.</strong> ${esc(s.action)}</p><p><strong>Say it aloud.</strong> “${esc(s.phrase)}”</p>
      <p><strong>Common mistake.</strong> ${esc(s.pitfall)}</p></${tagName}>`;
  }

  function caseView(id) {
    const s = scenarioById.get(id);
    if (!s) return missing();
    const module = moduleById.get(s.module);
    const cases = moduleCases(s.module);
    const index = cases.findIndex(item => item.id === id);
    state.last = id;
    save();
    return title(s.title,`Practice case ${index+1} of ${cases.length} in ${module.title}.`,module.stage) +
      `<div class="actions" style="margin:0 0 15px">${htmlLink("practice","Scenario library")}${htmlLink("lesson/"+module.id,"Lesson")}</div>
      <div class="case-layout"><section class="panel">
      <h2>What the customer says</h2>${quote(s.query)}
      <form id="practice-form" data-id="${s.id}"><fieldset class="question"><legend>What should you do next?</legend>
      ${questionChoices(s,shuffle(["correct","unsafe","deferred"]))}</fieldset>
      <div class="actions"><button type="submit" class="btn primary">Check answer</button><span id="mastery" class="status">${completed.has(id) ? "Mastered" : ""}</span></div></form>
      <div id="case-feedback" aria-live="polite"></div>
      ${modelAnswer(s)}
      <details><summary>Role-play a follow-up objection</summary>${quote(followUps[s.module][0])}<p><strong>What a coach should hear.</strong> ${esc(followUps[s.module][1])}</p></details>
      <details><summary>Practice your call note</summary>
      <p>Use fictional details only. Include the outcome, evidence, next action, owner and Pacific Time or the payer’s time zone.</p>
      <label class="field">Draft note<textarea spellcheck="true" placeholder="Verified contact. Reviewed … Next action … Owner … Follow-up …"></textarea></label>
      <p class="status">This draft is cleared when you leave the case.</p></details></section>
      <aside class="panel"><h2>Evidence to check</h2><p>${esc(s.evidence)}</p><h3>Next-action owner</h3><p>${esc(s.owner)}</p>
      ${s.critical ? `<div class="callout">${tag("Critical decision","critical")}<p style="margin-top:.5rem">Use the verified contact, approval or payment workflow before taking action.</p></div>` : ""}
      <div class="actions">${index > 0 ? htmlLink("case/"+cases[index-1].id,"Previous case") : ""}
      ${index < cases.length-1 ? htmlLink("case/"+cases[index+1].id,"Next case") : htmlLink("learn","Learning path")}</div></aside></div>`;
  }

  function tests() {
    return title("Mock tests","Choose a test to practice without hints. After submitting, review every answer and see critical misses separately.") +
      `<div class="grid exam-cards">${exams.map(exam => `<article class="card">
      <div class="meta">${tag(exam.count + " questions")}${tag(exam.pass + "% target")}</div>
      <h3 style="margin-top:.7rem">${esc(exam.title)}</h3><p>${esc(exam.description)}</p>
      <div class="actions"><button class="btn primary" data-action="start-exam" data-id="${exam.id}"${state.running && state.running.exam !== exam.id ? " disabled" : ""}>${state.running?.exam === exam.id ? "Resume test" : "Start test"}</button></div></article>`).join("")}</div>
      ${state.running ? `<div class="callout"><p>An assessment is in progress. Resume it to keep your answers, or discard it to switch tests.</p>
      <button class="btn" data-action="discard-exam">Discard in-progress test</button></div>` : ""}
      <section class="section panel"><h2>Attempt history</h2>${attemptsList(state.attempts)}</section>`;
  }

  function startExam(id) {
    const exam = examById.get(id);
    if (!exam) return;
    if (!state.running) {
      const scope = exam.modules.length ? exam.modules : learningOrder;
      const perModule = exam.count / scope.length;
      const picked = scope.flatMap(moduleId => {
        const available = shuffle(moduleCases(moduleId));
        const priority = (id !== "foundation") && available.find(s => s.critical);
        return priority ? [priority,...available.filter(s => s !== priority).slice(0,perModule-1)] : available.slice(0,perModule);
      });
      state.running = { exam:id, index:0, questions:shuffle(picked).map(s => ({ id:s.id, order:shuffle(["correct","unsafe","deferred"]), answer:null })) };
      save();
    }
    location.hash = "test/" + state.running.exam;
  }

  function test(id) {
    const running = state.running;
    if (!running || running.exam !== id) return tests();
    const exam = examById.get(id);
    const entry = running.questions[running.index];
    const s = scenarioById.get(entry.id);
    const count = running.questions.length;
    const last = running.index === count-1;
    const answered = running.questions.filter(q => q.answer).length;
    return title(exam.title,`Question ${running.index+1} of ${count} · ${answered} answered`,"Mock test") +
      `<section class="panel">
       <div class="track" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="${count}" aria-valuenow="${answered}"><span style="--fill:${percentage(answered,count)}%"></span></div>
       <h2 style="margin-top:15px">${esc(s.title)}</h2>${quote(s.query)}
       <form id="exam-form"><fieldset class="question"><legend>Choose the best next action</legend>
       ${questionChoices(s,entry.order,entry.answer)}</fieldset><div class="actions">
       ${running.index > 0 ? '<button class="btn" type="button" data-action="exam-back">Previous question</button>' : ""}
       <button class="btn primary" type="submit">${last ? "Submit test" : "Save and continue"}</button>
       ${htmlLink("exams","Pause test")}</div></form></section>`;
  }

  function submitTest() {
    const running = state.running;
    const exam = examById.get(running.exam);
    if (running.questions.some(q => !q.answer)) return;
    const score = percentage(running.questions.filter(q => q.answer === "correct").length,running.questions.length);
    const criticalMisses = running.questions.filter(q => q.answer !== "correct" && scenarioById.get(q.id).critical).length;
    const attempt = { id:Date.now().toString(36), exam:exam.id, date:new Date().toISOString(), score, criticalMisses, questions:running.questions };
    state.attempts.unshift(attempt);
    state.running = null;
    save();
    location.hash = "review/" + attempt.id;
  }

  const dateLabel = date => new Intl.DateTimeFormat(undefined,{dateStyle:"medium"}).format(new Date(date));

  function review(id) {
    const attempt = state.attempts.find(item => item.id === id);
    if (!attempt) return missing();
    const exam = examById.get(attempt.exam);
    const passed = attempt.score >= exam.pass && attempt.criticalMisses === 0;
    const scoredModules = [...new Set(attempt.questions.map(entry => scenarioById.get(entry.id).module))];
    return title(exam.title + " results",`Submitted ${dateLabel(attempt.date)}. Passing requires at least ${exam.pass}% and zero critical misses.`) +
      `<div class="grid kpis"><div class="panel kpi"><span>Score</span><strong>${attempt.score}%</strong></div>
      <div class="panel kpi"><span>Critical misses</span><strong>${attempt.criticalMisses}</strong></div>
      <div class="panel kpi"><span>Assessment outcome</span><strong>${passed ? "Passed" : "Review"}</strong></div></div>
      <section class="panel"><h2>Score by module</h2><div class="chart">${scoredModules.map(moduleId => {
        const group = attempt.questions.filter(entry => scenarioById.get(entry.id).module === moduleId);
        const correct = group.filter(entry => entry.answer === "correct").length;
        return `<div class="chart-row"><a class="chart-label" href="#lesson/${moduleId}">${esc(moduleById.get(moduleId).title)}</a>
        <div class="track" role="progressbar" aria-label="${esc(moduleById.get(moduleId).title)}" aria-valuemin="0" aria-valuemax="${group.length}" aria-valuenow="${correct}"><span style="--fill:${percentage(correct,group.length)}%"></span></div>
        <span class="chart-val">${correct} / ${group.length}</span></div>`;
      }).join("")}</div></section>
      <section class="section panel"><h2>Answer review</h2>${attempt.questions.map((entry,index) => {
        const s = scenarioById.get(entry.id);
        const correct = entry.answer === "correct";
        const chosen = entry.answer === "unsafe" ? s.pitfall : "Wait for another customer contact before verifying.";
        return `<details${!correct ? " open" : ""}><summary>${index+1}. ${esc(s.title)} · ${correct ? "Correct" : s.critical ? "Critical miss" : "Review"}</summary>
        ${quote(s.query)}${!correct ? `<p><strong>Your answer.</strong> ${esc(chosen)}</p>` : ""}${modelAnswer(s,"div")}<p>${htmlLink("case/"+s.id,"Practice this case","btn")}</p></details>`;
      }).join("")}<div class="actions">${htmlLink("exams","Back to mock tests","btn primary")}</div></section>`;
  }

  function missing() {
    return title("Page unavailable","Open the scenario library or use the navigation to continue learning.") + htmlLink("practice","Scenario library","btn primary");
  }
  const guideSections = [
    ["call", "Call flow"],
    ["math", "Balance reconciliation"],
    ["routing", "Escalation matrix"],
    ["writing", "Phrases & templates"],
    ["terms", "Glossary"]
  ];
  const guideEntries = {
    call: `<h2>Open, verify, ask and close</h2>
      <ol><li><strong>Open.</strong> State your name, Benzeen Auto Parts and a brief invoice-related purpose. Ask for the person who handles vendor invoices.</li>
      <li><strong>Verify.</strong> Confirm the account, location and AP role through the approved channel. Before calling on an invoice, check whether it was paid, returned, linked to an open delivery ticket, replaced with the original paid, or never delivered.</li>
      <li><strong>Ask.</strong> For a current balance, check whether AP has the invoice. For a verified overdue balance, ask which invoices they can pay and on what date. For a disputed line, confirm what evidence is missing and route the case.</li>
      <li><strong>Close.</strong> Repeat the action, amount or evidence requested, responsible person and follow-up date. Use Pacific Time for California and record the payer’s local time when it differs.</li></ol>
      <div class="callout"><h3>California conversations</h3><p>Use plain, courteous business English. Give an exact date and time instead of “next week.” Ask for an authorized bilingual handoff when needed. Keep voicemail generic and use company-approved wording and contact windows. Refer personal, guarantor, legal, recording-consent or restricted-contact questions to your lead for the applicable policy.</p></div>`,
    math: `<h2>Reconcile what remains open</h2><p>Work at invoice and line level. Compare the ledger to the verified receipt, remittance and approved credits. Clear an item only after the relevant payment or accounting action has posted.</p>
      <div class="table-scroll"><table><thead><tr><th scope="col">Practice example</th><th scope="col">Verified calculation</th><th scope="col">Next step</th></tr></thead><tbody>
      <tr><td>Short COD on a $510 invoice</td><td>$510 − $400 captured = $110 open</td><td>Confirm the capture and use the approved payment channel for $110.</td></tr>
      <tr><td>AP deducted $90 on a $620 invoice, but the memo was $70</td><td>$620 − $530 posted − $70 authorized credit = $20 open</td><td>Show AP the application and ask for a corrected allocation or $20 payment.</td></tr>
      <tr><td>Separate credit on an open statement</td><td>$620 invoice balance − $105 available credit = $515 net if approved and applied</td><td>Ask which invoice AP wants credited and route application to Accounting.</td></tr>
      <tr><td>Two tenders, only one settled</td><td>$750 invoice − $300 settled card = $450 open before check posts</td><td>Track the check separately and recalculate after posting.</td></tr>
      </tbody></table></div><div class="callout"><strong>Read the fields together.</strong> Invoice total, amount applied, balance due, settled status and aging bucket can answer different questions. Investigate conflicts before quoting a balance.</div>`,
    routing: `<h2>Send the right question to the right team</h2><div class="table-scroll"><table><thead><tr><th scope="col">Owner</th><th scope="col">Send cases about</th><th scope="col">Include</th></tr></thead><tbody>
      <tr><td>Collections / lead</td><td>AP routing, follow-ups, past-due requests and repeated missed promises</td><td>Verified contact, agreed amount and dates, prior attempts and owner.</td></tr>
      <tr><td>Accounting / Finance</td><td>Posting, remittance, refund identity, account authority, proposed offsets, write-offs and terms</td><td>Invoice, receipt or credit references, variance and requested decision.</td></tr>
      <tr><td>Sales / QC</td><td>Price, freight, concessions, grade, approval and replacement differences</td><td>Quote or invoice, disputed line, supporting record and exact question.</td></tr>
      <tr><td>Dispatch / Fulfillment</td><td>Proof of delivery, warehouse receipt, pickup, physical custody and DT status</td><td>Invoice, WO or DT, part or line, location, dates and movement evidence.</td></tr>
      <tr><td>Warranty / QC</td><td>Defect evidence, installation, repair allowances and labor review</td><td>Applicable paperwork, diagnosis, condition evidence and requested remedy.</td></tr>
